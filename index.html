    function exportFileBase(ext) {
      const menuObj = NAV_MENUS.find(m => m.id === state.activeMenu);
      const withRoom = ['ruangan_denah', 'sampul_ruangan', 'kartu_peserta', 'jadwal_piket', 'jadwal_pengawas', 'sampul_soal', 'berita_acara', 'absensi_ruang', 'label_meja'].includes(state.activeMenu);
      let extra = '';
      if (withRoom) {
        if (state.activeMenu === 'ruangan_denah' && state.selectedRoom === 'REKAP_RUANGAN') {
          extra = ' - Rekap Jumlah Siswa Per Ruangan';
        } else if (state.activeMenu === 'ruangan_denah' && state.selectedRoom === 'ALL') {
          extra = ' - Semua Ruangan (01-12)';
        } else if ((state.activeMenu === 'label_meja' || state.activeMenu === 'sampul_soal' || state.activeMenu === 'sampul_ruangan') && state.selectedRoom === 'ALL') {
          extra = ' - Semua Ruangan';
        } else {
          extra = ' ' + state.selectedRoom;
        }
        if (state.activeMenu === 'sampul_soal') {
          extra += ' - ' + (state.selectedDay || 'Senin') + ' Sesi ' + (state.selectedSesi || 1);
        }
      } else if (state.activeMenu === 'jadwal_pengawas') {
        extra = ' - Matriks Jadwal Pengawas (12 Ruang)';
      } else if (state.activeMenu === 'hadir_pengawas') {
        if (state.proctorHadirMode === 'master') {
          extra = ' - Seluruh Pengawas';
        } else if (state.proctorHadirDay === 'ALL' && state.proctorHadirSesi === 'ALL') {
          extra = ' - Semua Hari & Sesi (24 Lembar)';
        } else if (state.proctorHadirDay === 'ALL') {
          extra = ' - Semua Hari Sesi ' + (state.proctorHadirSesi || '1');
        } else if (state.proctorHadirSesi === 'ALL') {
          extra = ' - ' + (state.proctorHadirDay || 'Senin') + ' (Semua Sesi)';
        } else {
          extra = ' - ' + (state.proctorHadirDay || 'Senin') + ' Sesi ' + (state.proctorHadirSesi || '1');
        }
      } else if (state.activeMenu === 'ujian_susulan') {
        extra = ' - Daftar Peserta Ujian Susulan';
      } else if (state.activeMenu === 'jadwal_mapel') {
        if (state.selectedScheduleClass === 'ALL') {
          extra = ' - Semua 6 Kelas';
        } else {
          const cls = (SCHEDULE_CLASSES || []).find(c => c.id === state.selectedScheduleClass);
          extra = cls ? ' - ' + cls.name : '';
        }
      }
      const baseName = (menuObj ? menuObj.label.replace(/^\d+\.\s*/, '') : 'Dokumen') + extra;
      return ('MyAssesment - ' + baseName).replace(/[\\/:*?"<>|]+/g, '').trim() + ext;
    }
    function dxRgbToHex(c) {
      const m = String(c || '').match(/rgba?\(([^)]+)\)/);
      if (!m) return null;
      const p = m[1].split(/[,\/\s]+/).filter(Boolean).map(parseFloat);
      if (p.length > 3 && p[3] === 0) return null;
      return p.slice(0, 3).map(v => Math.round(v).toString(16).padStart(2, '0')).join('').toUpperCase();
    }

    function dxRunStyle(el) {
      const s = getComputedStyle(el);
      return {
        bold: parseInt(s.fontWeight, 10) >= 600,
        italics: s.fontStyle === 'italic',
        underline: String(s.textDecorationLine || s.textDecoration || '').includes('underline'),
        size: Math.max(12, Math.round(parseFloat(s.fontSize) * 0.75 * 2)),
        color: dxRgbToHex(s.color) || '000000'
      };
    }

    async function dxRasterize(el, ctx) {
      const r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return null;
      const canvas = await html2canvas(el, { scale: 2, backgroundColor: '#FFFFFF', useCORS: true });
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const data = new Uint8Array(await blob.arrayBuffer());
      const k = Math.min(1, ctx.contentW / r.width, ctx.maxImgH / r.height);
      return { data, w: r.width * k, h: r.height * k };
    }

    async function dxRasterizeSvg(el, ctx) {
      const r = el.getBoundingClientRect();
      if (r.width < 2 || r.height < 2) return null;
      const clone = el.cloneNode(true);
      clone.setAttribute('xmlns', 'http://www.w3.org/2000/svg');
      clone.setAttribute('width', r.width);
      clone.setAttribute('height', r.height);
      const xml = new XMLSerializer().serializeToString(clone);
      const img = new Image();
      img.src = 'data:image/svg+xml;charset=utf-8,' + encodeURIComponent(xml);
      await img.decode();
      const canvas = document.createElement('canvas');
      canvas.width = Math.round(r.width * 3);
      canvas.height = Math.round(r.height * 3);
      const c2 = canvas.getContext('2d');
      c2.fillStyle = '#FFFFFF';
      c2.fillRect(0, 0, canvas.width, canvas.height);
      c2.drawImage(img, 0, 0, canvas.width, canvas.height);
      const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
      const data = new Uint8Array(await blob.arrayBuffer());
      const k = Math.min(1, ctx.contentW / r.width, ctx.maxImgH / r.height);
      return { data, w: r.width * k, h: r.height * k };
    }

    async function dxCollectInline(n, runs, ctx) {
      if (n.nodeType === 3) {
        const par = n.parentElement;
        let t = n.textContent.replace(/[ \t\r\n]+/g, ' ');
        if (!t) return;
        if (getComputedStyle(par).textTransform === 'uppercase') t = t.toUpperCase();
        runs.push({ type: 'text', text: t, st: dxRunStyle(par) });
        return;
      }
      if (n.nodeType !== 1) return;
      const tag = n.tagName.toLowerCase();
      if (tag === 'br') { runs.push({ type: 'br' }); return; }
      if (getComputedStyle(n).display === 'none') return;
      if (tag === 'svg' || tag === 'img' || n.dataset.docx === 'image') {
        const img = tag === 'svg' ? await dxRasterizeSvg(n, ctx) : await dxRasterize(n, ctx);
        if (img) runs.push({ type: 'img', ...img });
        return;
      }
      for (const c of n.childNodes) await dxCollectInline(c, runs, ctx);
    }

    function dxMakeParagraph(runs, el, extra = {}) {
      const r = runs.slice();
      while (r.length && r[0].type === 'text') {
        r[0] = { ...r[0], text: r[0].text.replace(/^ +/, '') };
        if (r[0].text === '') r.shift(); else break;
      }
      while (r.length && r[r.length - 1].type === 'text') {
        const l = r[r.length - 1];
        r[r.length - 1] = { ...l, text: l.text.replace(/ +$/, '') };
        if (r[r.length - 1].text === '') r.pop(); else break;
      }
      if (!r.length) return null;
      const s = getComputedStyle(el);
      const fs = parseFloat(s.fontSize) || 14;
      const lh = parseFloat(s.lineHeight);
      const lineRatio = isNaN(lh) ? 1.15 : Math.min(1.8, Math.max(1, lh / fs));
      return { kind: 'p', runs: r, align: s.textAlign, lineRatio, before: 0, after: 0, ...extra };
    }

    function dxSpacer(px, side = 'after') {
      return { kind: 'p', runs: [], spacer: true, align: 'left', lineRatio: 1, before: side === 'before' ? px : 0, after: side === 'after' ? px : 0 };
    }

    function dxBuildParagraph(sp) {
      const D = window.docx;
      const alignMap = { center: D.AlignmentType.CENTER, right: D.AlignmentType.RIGHT, end: D.AlignmentType.RIGHT, justify: D.AlignmentType.JUSTIFIED };
      if (sp.spacer) {
        return new D.Paragraph({
          children: [new D.TextRun({ text: '', size: 2 })],
          spacing: { before: Math.round(sp.before * 15), after: Math.round(sp.after * 15), line: 20, lineRule: D.LineRuleType.EXACT }
        });
      }
      const children = sp.runs.map(r => {
        if (r.type === 'br') return new D.TextRun({ break: 1 });
        if (r.type === 'tab') return new D.TextRun({ children: [new D.Tab()] });
        if (r.type === 'img') return new D.ImageRun({ data: r.data, type: 'png', transformation: { width: Math.max(1, Math.round(r.w)), height: Math.max(1, Math.round(r.h)) } });
        return new D.TextRun({
          text: r.text, bold: r.st.bold, italics: r.st.italics,
          underline: r.st.underline ? {} : undefined,
          size: r.st.size, color: r.st.color, font: 'Arial'
        });
      });
      const opts = {
        children,
        alignment: alignMap[sp.align] || D.AlignmentType.LEFT,
        spacing: { before: Math.round(sp.before * 15), after: Math.round(sp.after * 15), line: Math.round(sp.lineRatio * 240), lineRule: D.LineRuleType.AUTO }
      };
      if (sp.indent) opts.indent = sp.indent;
      if (sp.tabs) opts.tabStops = sp.tabs;
      if (sp.borderBottom) opts.border = { bottom: { style: D.BorderStyle.SINGLE, size: 8, color: '000000', space: 2 } };
      return new D.Paragraph(opts);
    }

    function dxFinalize(items) {
      const D = window.docx;
      const out = [];
      let prevTable = false;
      for (const it of items) {
        if (it.kind === 't') {
          if (prevTable) out.push(dxBuildParagraph(dxSpacer(1)));
          out.push(it.node);
          prevTable = true;
        } else {
          out.push(dxBuildParagraph(it));
          prevTable = false;
        }
      }
      if (!out.length || prevTable) out.push(new D.Paragraph({ spacing: { before: 0, after: 0, line: 20, lineRule: D.LineRuleType.EXACT }, children: [new D.TextRun({ text: '', size: 2 })] }));
      return out;
    }

    async function dxBlockChildren(el, ctx) {
      const out = [];
      let buf = [];
      const flush = async () => {
        if (!buf.length) return;
        const nodes = buf; buf = [];
        const runs = [];
        for (const n of nodes) await dxCollectInline(n, runs, ctx);
        const sp = dxMakeParagraph(runs, el);
        if (sp) out.push(sp);
      };
      for (const n of el.childNodes) {
        if (n.nodeType === 3) {
          if (n.textContent.trim() === '' && !buf.length) continue;
          buf.push(n);
          continue;
        }
        if (n.nodeType !== 1) continue;
        const tag = n.tagName.toLowerCase();
        const d = getComputedStyle(n).display;
        const special = n.dataset.docx === 'image' || n.dataset.docx === 'leader';
        if (((d.startsWith('inline') || tag === 'svg' || tag === 'img') && !special) || tag === 'br') { buf.push(n); continue; }
        await flush();
        out.push(...await dxConvertBlock(n, ctx));
      }
      await flush();
      return out;
    }

    function dxApplyBox(n, items) {
      const s = getComputedStyle(n);
      const mt = parseFloat(s.marginTop) || 0;
      const mb = parseFloat(s.marginBottom) || 0;
      if (items.length && items[0].kind === 'p') items[0].before += mt; else if (mt > 4) items.unshift(dxSpacer(mt, 'before'));
      if (items.length && items[items.length - 1].kind === 'p') {
        const last = items[items.length - 1];
        last.after += mb;
        if (parseFloat(s.borderBottomWidth) > 0 && s.borderBottomStyle !== 'none') last.borderBottom = true;
      } else if (mb > 4) items.push(dxSpacer(mb));
      return items;
    }

    function dxBorders(cst) {
      const D = window.docx;
      const b = {};
      [['top', 'Top'], ['right', 'Right'], ['bottom', 'Bottom'], ['left', 'Left']].forEach(([k, K]) => {
        const w = parseFloat(cst['border' + K + 'Width']) || 0;
        const st = cst['border' + K + 'Style'];
        if (w > 0 && st !== 'none' && st !== 'hidden') {
          b[k] = { style: st === 'dotted' ? D.BorderStyle.DOTTED : st === 'dashed' ? D.BorderStyle.DASHED : D.BorderStyle.SINGLE, size: Math.max(2, Math.round(w * 6)), color: dxRgbToHex(cst['border' + K + 'Color']) || '000000' };
        } else {
          b[k] = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' };
        }
      });
      return b;
    }

    function dxNoBorders() {
      const D = window.docx;
      const none = { style: D.BorderStyle.NONE, size: 0, color: 'FFFFFF' };
      return { top: none, bottom: none, left: none, right: none, insideHorizontal: none, insideVertical: none };
    }

    function dxPad(cst, k) {
      return {
        top: Math.round((parseFloat(cst.paddingTop) || 0) * k),
        bottom: Math.round((parseFloat(cst.paddingBottom) || 0) * k),
        left: Math.round((parseFloat(cst.paddingLeft) || 0) * k),
        right: Math.round((parseFloat(cst.paddingRight) || 0) * k)
      };
    }

    async function dxConvertTable(t, ctx) {
      const D = window.docx;
      const k = ctx.k;
      const isData = t.classList.contains('f4-table');
      const trect = t.getBoundingClientRect();
      const trs = Array.from(t.rows);
      const edges = [];
      const addEdge = x => { if (!edges.some(e => Math.abs(e - x) < 1.5)) edges.push(x); };
      trs.forEach(tr => Array.from(tr.cells).forEach(c => { const r = c.getBoundingClientRect(); addEdge(r.left); addEdge(r.right); }));
      edges.sort((a, b) => a - b);
      const idxOf = x => edges.findIndex(e => Math.abs(e - x) < 1.5);
      const colW = edges.slice(1).map((e, i) => Math.max(40, Math.round((e - edges[i]) * k)));

      const rows = [];
      for (const tr of trs) {
        const cells = [];
        for (const c of Array.from(tr.cells)) {
          const r = c.getBoundingClientRect();
          const cst = getComputedStyle(c);
          const span = Math.max(1, idxOf(r.right) - idxOf(r.left));
          const items = await dxBlockChildren(c, ctx);
          const children = dxFinalize(items);
          const bg = dxRgbToHex(cst.backgroundColor);
          const va = cst.verticalAlign === 'top' ? D.VerticalAlign.TOP : cst.verticalAlign === 'bottom' ? D.VerticalAlign.BOTTOM : D.VerticalAlign.CENTER;
          cells.push(new D.TableCell({
            children,
            columnSpan: span > 1 ? span : undefined,
            rowSpan: c.rowSpan > 1 ? c.rowSpan : undefined,
            width: { size: Math.round(r.width * k), type: D.WidthType.DXA },
            verticalAlign: va,
            borders: dxBorders(cst),
            shading: bg ? { type: D.ShadingType.CLEAR, fill: bg, color: 'auto' } : undefined,
            margins: dxPad(cst, k)
          }));
        }
        const rr = tr.getBoundingClientRect();
        rows.push(new D.TableRow({
          children: cells,
          cantSplit: true,
          tableHeader: tr.parentElement && tr.parentElement.tagName === 'THEAD',
          height: isData ? { value: Math.round(rr.height * k), rule: D.HeightRule.ATLEAST } : undefined
        }));
      }
      return new D.Table({
        rows,
        width: { size: Math.round(trect.width * k), type: D.WidthType.DXA },
        columnWidths: colW,
        layout: D.TableLayoutType.FIXED,
        borders: dxNoBorders()
      });
    }

    async function dxBoxTable(n, ctx, items) {
      const D = window.docx;
      const s = getComputedStyle(n);
      const r = n.getBoundingClientRect();
      const w = Math.round(r.width * ctx.k);
      const table = new D.Table({
        rows: [new D.TableRow({
          cantSplit: true,
          children: [new D.TableCell({
            children: dxFinalize(items),
            width: { size: w, type: D.WidthType.DXA },
            borders: dxBorders(s),
            margins: dxPad(s, ctx.k)
          })]
        })],
        width: { size: w, type: D.WidthType.DXA },
        columnWidths: [w],
        layout: D.TableLayoutType.FIXED,
        borders: dxNoBorders()
      });
      return table;
    }

    async function dxConvertBlock(n, ctx) {
      const D = window.docx;
      const s = getComputedStyle(n);
      const tag = n.tagName.toLowerCase();
      if (s.display === 'none') return [];

      if (n.dataset.docx === 'image' || s.display === 'grid') {
        const img = await dxRasterize(n, ctx);
        if (!img) return [];
        const sp = { kind: 'p', runs: [{ type: 'img', ...img }], align: 'center', lineRatio: 1, before: 0, after: 0 };
        return dxApplyBox(n, [sp]);
      }

      if (n.dataset.docx === 'leader') {
        const kids = Array.from(n.children);
        const first = kids[0], last = kids[kids.length - 1];
        const pos = Math.round(n.getBoundingClientRect().width * ctx.k);
        const mb = parseFloat(s.marginBottom) || 0;
        const runs = [
          { type: 'text', text: first.textContent.trim(), st: dxRunStyle(first) },
          { type: 'tab' },
          { type: 'text', text: last.textContent.trim(), st: dxRunStyle(last) }
        ];
        return [{ kind: 'p', runs, align: 'left', lineRatio: 1.5, before: 0, after: mb, tabs: [{ type: D.TabStopType.RIGHT, position: pos, leader: D.LeaderType.DOT }] }];
      }

      if (tag === 'table') {
        const node = await dxConvertTable(n, ctx);
        const items = [{ kind: 't', node }];
        const mt = parseFloat(s.marginTop) || 0, mb = parseFloat(s.marginBottom) || 0;
        if (mt > 4) items.unshift(dxSpacer(mt, 'before'));
        if (mb > 4) items.push(dxSpacer(mb));
        return items;
      }

      if (tag === 'ol' || tag === 'ul') {
        const out = [];
        let i = 1;
        for (const li of Array.from(n.children)) {
          if (li.tagName.toLowerCase() !== 'li') continue;
          const items = dxApplyBox(li, await dxBlockChildren(li, ctx));
          const mark = tag === 'ol' ? `${i}.` : '•';
          if (items.length && items[0].kind === 'p') {
            items[0].runs.unshift({ type: 'text', text: mark + ' ', st: dxRunStyle(li) });
          } else {
            items.unshift({ kind: 'p', runs: [{ type: 'text', text: mark, st: dxRunStyle(li) }], align: 'left', lineRatio: 1.15, before: 0, after: 0 });
          }
          items.forEach(it => { if (it.kind === 'p') it.indent = { left: 420, hanging: 420 }; });
          out.push(...items);
          i++;
        }
        return out;
      }

      const display = s.display;
      if (display === 'flex' || display === 'inline-flex') {
        const kids = Array.from(n.children).filter(c => getComputedStyle(c).display !== 'none');
        if (kids.length > 1 && !String(s.flexDirection).startsWith('column')) {
          const W = n.getBoundingClientRect().width;
          const widths = kids.map(c => c.getBoundingClientRect().width);
          const rest = W - widths.reduce((a, b) => a + b, 0);
          if (rest > 0) widths[0] += rest;
          const D2 = window.docx;
          const cells = [];
          for (let i = 0; i < kids.length; i++) {
            const items = await dxBlockChildren(kids[i], ctx);
            if (i === kids.length - 1 && String(s.justifyContent).includes('space-between')) items.forEach(it => { if (it.kind === 'p') it.align = 'right'; });
            cells.push(new D2.TableCell({
              children: dxFinalize(items),
              width: { size: Math.round(widths[i] * ctx.k), type: D2.WidthType.DXA },
              borders: dxBorders({}),
              margins: { top: 0, bottom: 0, left: 0, right: 0 }
            }));
          }
          const tw = Math.round(W * ctx.k);
          const node = new D2.Table({
            rows: [new D2.TableRow({ children: cells, cantSplit: true })],
            width: { size: tw, type: D2.WidthType.DXA },
            columnWidths: widths.map(w => Math.round(w * ctx.k)),
            layout: D2.TableLayoutType.FIXED,
            borders: dxNoBorders()
          });
          return dxApplyBox(n, [{ kind: 't', node }]);
        }
      }

      const hasBox = parseFloat(s.borderTopWidth) > 0 && s.borderTopStyle !== 'none' && parseFloat(s.borderLeftWidth) > 0;
      const items = await dxBlockChildren(n, ctx);
      if (hasBox) {
        const node = await dxBoxTable(n, ctx, items);
        return dxApplyBox(n, [{ kind: 't', node }]);
      }
      if (!items.length) {
        const h = parseFloat(s.height) || 0;
        return h > 4 ? [dxSpacer(h)] : [];
      }
      return dxApplyBox(n, items);
    }

    async function saveDocxFromSheets(sheets, fileName) {
      if (!sheets || sheets.length === 0) {
        notify("Tidak ada lembar dokumen untuk disimpan.", "error");
        return;
      }
      if (!window.docx || typeof html2canvas === 'undefined') {
        notify("Pustaka Word (.docx) belum siap, periksa koneksi internet lalu coba lagi.", "error");
        return;
      }
      const isAllA4 = sheets.every(sh => sh.classList && (sh.classList.contains('a4-sheet') || sh.dataset.paper === 'A4'));
      const hasLandscape = sheets.some(sh => sh.classList && (sh.classList.contains('landscape-sheet') || sh.dataset.orientation === 'landscape'));
      notify(`Membuat file Word (${sheets.length} halaman ${hasLandscape ? 'F4 Landscape' : (isAllA4 ? 'A4' : 'F4')}), mohon tunggu...`);
      const stage = document.createElement('div');
      const maxStageW = hasLandscape ? '330mm' : (isAllA4 ? '210mm' : '215mm');
      stage.style.cssText = `position: fixed; left: -10000px; top: 0; width: ${maxStageW}; background: #FFFFFF; z-index: -1;`;
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        const D = window.docx;
        sheets.forEach(sh => {
          const clone = sh.cloneNode(true);
          clone.style.margin = '0';
          clone.style.border = 'none';
          clone.style.boxShadow = 'none';
          if (sh.classList && (sh.classList.contains('a4-sheet') || sh.dataset.paper === 'A4')) {
            clone.style.width = '210mm';
            clone.style.minHeight = '297mm';
          } else {
            if (sh.classList && (sh.classList.contains('landscape-sheet') || sh.dataset.orientation === 'landscape')) {
              clone.style.width = '330mm';
              clone.style.minHeight = '215mm';
            } else {
              clone.style.width = '215mm';
              clone.style.minHeight = '330mm';
            }
          }
          stage.appendChild(clone);
        });
        document.body.appendChild(stage);
        stage.querySelectorAll('.f4-sheet:not(.landscape-sheet):not([data-orientation="landscape"])').forEach(sh => fitSheetTables(sh, 258, 9));

        const sections = [];
        for (const sheet of Array.from(stage.querySelectorAll('.f4-sheet, .a4-sheet'))) {
          const isA4 = sheet.classList.contains('a4-sheet') || sheet.dataset.paper === 'A4';
          const sst = getComputedStyle(sheet);
          const contentW = sheet.clientWidth - (parseFloat(sst.paddingLeft) || 0) - (parseFloat(sst.paddingRight) || 0);
          const isLandscape = sheet.classList.contains('landscape-sheet') || sheet.dataset.orientation === 'landscape';
          const twipsWidth = isLandscape ? (isA4 ? 16838 : 18709) : (isA4 ? 11906 : 12189);
          const twipsHeight = isLandscape ? (isA4 ? 11906 : 12189) : (isA4 ? 16838 : 18709);
          const twipsMarginTopBottom = isLandscape ? 340 : (isA4 ? 283 : 567);
          const twipsMarginLeftRight = isLandscape ? 340 : (isA4 ? 312 : 567);
          const targetTwipW = twipsWidth - (twipsMarginLeftRight * 2);
          const ctx = { contentW, k: targetTwipW / contentW, maxImgH: 1000 };
          const items = await dxBlockChildren(sheet, ctx);
          sections.push({
            properties: {
              page: {
                size: { width: twipsWidth, height: twipsHeight },
                margin: { top: twipsMarginTopBottom, bottom: twipsMarginTopBottom, left: twipsMarginLeftRight, right: twipsMarginLeftRight }
              }
            },
            children: dxFinalize(items)
          });
        }
        const doc = new D.Document({
          creator: 'MyAssesment',
          title: fileName.replace(/\.docx$/i, ''),
          styles: { default: { document: { run: { font: 'Arial', size: 20 } } } },
          sections
        });
        const blob = await D.Packer.toBlob(doc);
        const url = URL.createObjectURL(blob);
        const a = document.createElement('a');
        a.href = url;
        a.download = fileName;
        document.body.appendChild(a);
        a.click();
        document.body.removeChild(a);
        setTimeout(() => URL.revokeObjectURL(url), 4000);
        notify("File Word berhasil dibuat: " + fileName);
      } catch (err) {
        notify("Gagal membuat file Word: " + err.message, "error");
      } finally {
        if (stage.parentNode) stage.parentNode.removeChild(stage);
      }
    }

    async function saveAsDocx() {
      if (!hasPreview()) {
        notify("Halaman ini tidak memiliki pratinjau dokumen untuk disimpan.", "error");
        return;
      }
      const sheets = Array.from(document.querySelectorAll('#print-mount .f4-sheet, #print-mount .a4-sheet'));
      await saveDocxFromSheets(sheets, exportFileBase('.docx'));
    }

        const menu = state.activeMenu;

          const rows = [

          return;
        }

        if (menu === 'ruangan_denah') {
          if (state.selectedRoom === 'REKAP_RUANGAN') {
            const wb = XLSX.utils.book_new();

            const schoolClasses = {};
            const roomTotals = {};
            ROOM_LIST.forEach(r => roomTotals[r] = 0);
            let grandTotal = 0;

            state.participants.forEach(p => {
              const cls = (p.kelas_sekolah || '').trim();
              if (!cls) return;
              if (!schoolClasses[cls]) {
                schoolClasses[cls] = { total: 0 };
                ROOM_LIST.forEach(r => schoolClasses[cls][r] = 0);
              }
              const r = p.ruangan && ROOM_LIST.includes(p.ruangan) ? p.ruangan : 'Ruang 01';
              schoolClasses[cls][r] = (schoolClasses[cls][r] || 0) + 1;
              schoolClasses[cls].total += 1;
              roomTotals[r] = (roomTotals[r] || 0) + 1;
              grandTotal += 1;
            });

            const sortedSchool = Object.keys(schoolClasses).sort((a, b) => {
              const kA = getSchoolClassSortKey(a), kB = getSchoolClassSortKey(b);
              if (kA !== kB) return kA - kB;
              return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
            });

            const rowsSekolah = [
              ["REKAPITULASI JUMLAH SISWA SEKOLAH PER RUANGAN (RUANG 01 - 12)"],
              [`Tahun Pelajaran: ${state.settings.tahunAjaran || '2024/2025'} | Semester: ${state.settings.semester || 'Ganjil'}`],
              [],
              ["NO", "KELAS SEKOLAH", ...ROOM_LIST.map(r => r.toUpperCase()), "TOTAL SISWA"],
              ...sortedSchool.map((cls, idx) => [
                idx + 1,
                cls,
                ...ROOM_LIST.map(r => schoolClasses[cls][r] || 0),
                schoolClasses[cls].total
              ]),
              ["", "TOTAL SISWA PER RUANGAN", ...ROOM_LIST.map(r => roomTotals[r] || 0), grandTotal]
            ];
            const wsSekolah = XLSX.utils.aoa_to_sheet(rowsSekolah);
            XLSX.utils.book_append_sheet(wb, wsSekolah, "Rekap_Sekolah");

            const dinClasses = {};
            const dinRoomTotals = {};
            ROOM_LIST.forEach(r => dinRoomTotals[r] = 0);
            let dinGrandTotal = 0;

            state.participants.forEach(p => {
              const cls = (p.kelas_diniyyah || '').trim().replace(/ulya/gi, 'Wustho');
              if (!cls) return;
              if (!dinClasses[cls]) {
                dinClasses[cls] = { total: 0 };
                ROOM_LIST.forEach(r => dinClasses[cls][r] = 0);
              }
              const r = p.ruangan && ROOM_LIST.includes(p.ruangan) ? p.ruangan : 'Ruang 01';
              dinClasses[cls][r] = (dinClasses[cls][r] || 0) + 1;
              dinClasses[cls].total += 1;
              dinRoomTotals[r] = (dinRoomTotals[r] || 0) + 1;
              dinGrandTotal += 1;
            });

            const sortedDin = Object.keys(dinClasses).sort((a, b) => {
              const kA = getDiniyyahClassSortKey(a), kB = getDiniyyahClassSortKey(b);
              if (kA !== kB) return kA - kB;
              return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
            });

            const rowsDin = [
              ["REKAPITULASI JUMLAH SISWA DINIYYAH PER RUANGAN (RUANG 01 - 12)"],
              [`Tahun Pelajaran: ${state.settings.tahunAjaran || '2024/2025'} | Semester: ${state.settings.semester || 'Ganjil'}`],
              [],
              ["NO", "KELAS DINIYYAH", ...ROOM_LIST.map(r => r.toUpperCase()), "TOTAL SISWA"],
              ...sortedDin.map((cls, idx) => [
                idx + 1,
                cls,
                ...ROOM_LIST.map(r => dinClasses[cls][r] || 0),
                dinClasses[cls].total
              ]),
              ["", "TOTAL SISWA PER RUANGAN", ...ROOM_LIST.map(r => dinRoomTotals[r] || 0), dinGrandTotal]
            ];
            const wsDin = XLSX.utils.aoa_to_sheet(rowsDin);
            XLSX.utils.book_append_sheet(wb, wsDin, "Rekap_Diniyyah");

            XLSX.writeFile(wb, "Rekapitulasi_Jumlah_Siswa_Per_Ruangan.xlsx");
            notify("Berhasil mengekspor Rekapitulasi 12 Ruang ke Excel (.xlsx).");
            return;
          } else {
            const isAll = state.selectedRoom === 'ALL' || !state.selectedRoom;
            const roomsToExport = isAll ? ROOM_LIST : [state.selectedRoom];

      importCardDesign: (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (file.type.startsWith('image/')) {
          const reader = new FileReader();
          reader.onload = (re) => {
            state.settings.cardBgImage = re.target.result;
            notify("Desain latar belakang kartu ujian berhasil diimpor.");
            renderApp();
          };
          reader.readAsDataURL(file);
        } else if (file.name.endsWith('.json')) {
          const reader = new FileReader();
          reader.onload = (re) => {
            try {
              const data = JSON.parse(re.target.result);
              if (data.cardBgImage) state.settings.cardBgImage = data.cardBgImage;
              if (data.yayasan) state.settings.yayasan = data.yayasan;
              if (data.instansi) state.settings.instansi = data.instansi;
              notify("Desain kartu ujian berhasil diimpor dari file JSON.");
              renderApp();
            } catch (err) {
              notify("Gagal membaca file desain JSON: " + err.message, "error");
            }
          };
          reader.readAsText(file);
        }
      },

      resetCardDesign: () => {
        state.settings.cardBgImage = null;
        notify("Desain kartu ujian dikembalikan ke tampilan standar.");
        renderApp();
      },

      importMapelXlsx: (e) => {
        const file = e.target.files?.[0];
        if (!file) return;
        if (typeof XLSX === 'undefined') {
          notify("Pustaka Excel belum siap. Silakan refresh halaman.", "error");
          return;
        }

        const reader = new FileReader();
        reader.onload = async (re) => {
          try {
            const data = new Uint8Array(re.target.result);
            const workbook = XLSX.read(data, { type: 'array' });
            const firstSheetName = workbook.SheetNames[0];
            const worksheet = workbook.Sheets[firstSheetName];
            const rows = XLSX.utils.sheet_to_json(worksheet);

            if (!rows || rows.length === 0) {
              notify("File Excel kosong atau format tidak sesuai.", "error");
              return;
            }

            let updatedCount = 0;
            rows.forEach(r => {
              const rawHari = String(r['Hari'] || r['HARI'] || r.hari || '').trim();
              const matchedDay = DAY_LIST.find(d => d.toLowerCase() === rawHari.toLowerCase());
              if (!matchedDay || !state.schedules[matchedDay]) return;

              const tanggal = String(r['Tanggal'] || r['TANGGAL'] || r.tanggal || '').trim();
              if (tanggal) state.schedules[matchedDay].tanggal = tanggal;

              const sesiNum = parseInt(r['Sesi'] || r['SESI'] || r.sesi || 0, 10);
              const slotIdx = (sesiNum >= 1 && sesiNum <= 4) ? sesiNum - 1 : -1;
              if (slotIdx >= 0 && state.schedules[matchedDay].slots[slotIdx]) {
                const slot = state.schedules[matchedDay].slots[slotIdx];
                const waktu = String(r['Waktu'] || r['WAKTU'] || r.waktu || '').trim();
                if (waktu) slot.waktu = waktu;

                const m7 = String(r['Mapel MTs VII'] || r['MTs VII'] || r['Mapel VII'] || r.mapel_mts_7 || '').trim();
                const m8 = String(r['Mapel MTs VIII'] || r['MTs VIII'] || r['Mapel VIII'] || r.mapel_mts_8 || '').trim();
                const m9 = String(r['Mapel MTs IX'] || r['MTs IX'] || r['Mapel IX'] || r.mapel_mts_9 || '').trim();
                const m10 = String(r['Mapel MA X'] || r['MA X'] || r['Mapel X'] || r.mapel_ma_10 || '').trim();
                const m11 = String(r['Mapel MA XI'] || r['MA XI'] || r['Mapel XI'] || r.mapel_ma_11 || '').trim();
                const m12 = String(r['Mapel MA XII'] || r['MA XII'] || r['Mapel XII'] || r.mapel_ma_12 || '').trim();

                if (m7) slot.mapel_mts_7 = m7;
                if (m8) slot.mapel_mts_8 = m8;
                if (m9) slot.mapel_mts_9 = m9;
                if (m10) slot.mapel_ma_10 = m10;
                if (m11) slot.mapel_ma_11 = m11;
                if (m12) slot.mapel_ma_12 = m12;

                const mapelMA = String(r['Mapel MA'] || r['MAPEL MA'] || r['Mata Pelajaran MA'] || r.mapel_ma || '').trim();
                const mapelMTS = String(r['Mapel MTs'] || r['MAPEL MTS'] || r['Mata Pelajaran MTs'] || r.mapel_mts || '').trim();
                const mapelDiniyyah = String(r['Mapel Diniyyah'] || r['MAPEL DINIYYAH'] || r.mapel_diniyyah || '').trim();
                const mapelGeneral = String(r['Mata Pelajaran'] || r['Mapel'] || r.mapel || '').trim();

                if (mapelMA) {
                  slot.mapel_ma = mapelMA;
                  if (!slot.mapel_ma_10) slot.mapel_ma_10 = mapelMA;
                  if (!slot.mapel_ma_11) slot.mapel_ma_11 = mapelMA;
                  if (!slot.mapel_ma_12) slot.mapel_ma_12 = mapelMA;
                }
                if (mapelMTS) {
                  slot.mapel_mts = mapelMTS;
                  if (!slot.mapel_mts_7) slot.mapel_mts_7 = mapelMTS;
                  if (!slot.mapel_mts_8) slot.mapel_mts_8 = mapelMTS;
                  if (!slot.mapel_mts_9) slot.mapel_mts_9 = mapelMTS;
                }
                if (mapelDiniyyah && slotIdx === 3) {
                  slot.mapel_ma = mapelDiniyyah;
                  slot.mapel_mts = mapelDiniyyah;
                  if (!m7) slot.mapel_mts_7 = mapelDiniyyah;
                  if (!m8) slot.mapel_mts_8 = mapelDiniyyah;
                  if (!m9) slot.mapel_mts_9 = mapelDiniyyah;
                  if (!m10) slot.mapel_ma_10 = mapelDiniyyah;
                  if (!m11) slot.mapel_ma_11 = mapelDiniyyah;
                  if (!m12) slot.mapel_ma_12 = mapelDiniyyah;
                }
                if (mapelGeneral) {
                  if (!slot.mapel_ma) slot.mapel_ma = mapelGeneral;
                  if (!slot.mapel_mts) slot.mapel_mts = mapelGeneral;
                  if (!slot.mapel_mts_7) slot.mapel_mts_7 = mapelGeneral;
                  if (!slot.mapel_mts_8) slot.mapel_mts_8 = mapelGeneral;
                  if (!slot.mapel_mts_9) slot.mapel_mts_9 = mapelGeneral;
                  if (!slot.mapel_ma_10) slot.mapel_ma_10 = mapelGeneral;
                  if (!slot.mapel_ma_11) slot.mapel_ma_11 = mapelGeneral;
                  if (!slot.mapel_ma_12) slot.mapel_ma_12 = mapelGeneral;
                  slot.mapel = mapelGeneral;
                }
                updatedCount++;
              }
            });

            notify(`Berhasil mengimpor ${updatedCount} jadwal mata pelajaran dari Excel.`);
            if (typeof saveSchedulesToCloud === 'function') {
              await saveSchedulesToCloud(state.schedules);
            }
            renderApp();
          } catch (err) {
            notify("Gagal mengimpor file Excel: " + err.message, "error");
          }
        };
        reader.readAsArrayBuffer(file);
      },

      uploadProctorExcel: (event) => handleProctorExcelUpload(event),

      regenerateParticipantNumbers: () => regenerateAllParticipantNumbers(),

      previewAutoNoPeserta: (kelasInput) => {
        if (state.editingParticipantId) return;
        const noInput = document.getElementById('input-no-peserta-manual');
        if (!noInput) return;
        const isMA = isKelasMA(kelasInput);
        const countSameUnit = state.participants.filter(p => isKelasMA(p.kelas_sekolah) === isMA).length + 1;
        noInput.value = formatExamParticipantNumber(kelasInput, countSameUnit);
      },

      distributeRooms: () => distributeTo12RoomsAndSeats(),

      setRoomGenderAllocation: (maleCount) => {
        const count = Math.max(1, Math.min(11, Number(maleCount) || 7));
        state.maleRoomCount = count;
        try {
          localStorage.setItem('myassessment_male_room_count', String(count));
        } catch (e) { }
        renderApp();
        notify(`Alokasi ruangan diperbarui: ${count} Ruang Putra (R.01-R.${String(count).padStart(2, '0')}) & ${12 - count} Ruang Putri (R.${String(count + 1).padStart(2, '0')}-R.12). Silakan klik "Bagi Otomatis" untuk menerapkan pembagian.`);
      },

      startEditParticipant: (id) => {
        state.editingParticipantId = id;
        renderApp();
        const formEl = document.getElementById('input-no-peserta-manual');
        if (formEl) formEl.scrollIntoView({ behavior: 'smooth', block: 'center' });
      },

      cancelEditParticipant: () => {
        state.editingParticipantId = null;
        renderApp();
      },

      toggleClearAllParticipants: (show) => {
        state.confirmDeleteAllParticipants = Boolean(show);
        renderApp();
      },

      confirmClearAllParticipants: async () => {
        await deleteAllParticipantsFromCloud();
        notify("Seluruh data peserta berhasil dihapus.");
      },

      toggleClearAllProctors: (show) => {
        state.confirmDeleteAllProctors = Boolean(show);
        renderApp();
      },

      confirmClearAllProctors: async () => {
        await deleteAllProctorsFromCloud();
        notify("Seluruh data pengawas berhasil dihapus.");
      },

      addParticipant: async (e) => {
        e.preventDefault();
        const f = e.target;
        const kelasSekolah = f.kelas_sekolah.value.trim();
        const isMA = isKelasMA(kelasSekolah);
        const rawNo = f.no_peserta.value.trim();

        if (state.editingParticipantId) {
          const existing = state.participants.find(p => p.id === state.editingParticipantId);
          const updatedObj = {
            ...(existing || {}),
            id: state.editingParticipantId,
            no_peserta: rawNo || formatExamParticipantNumber(kelasSekolah, Number(f.no_kursi.value) || 1),
            nama: f.nama.value.trim(),
            gender: f.gender.value,
            kelas_sekolah: kelasSekolah,
            kelas_diniyyah: f.kelas_diniyyah.value.trim(),
            ruangan: f.ruangan.value,
            no_kursi: Number(f.no_kursi.value),
            hari_piket: f.hari_piket.value,
            password_peserta: existing?.password_peserta || "12345"
          };
          state.editingParticipantId = null;
          await saveParticipantToCloud(updatedObj);
          notify(`Data peserta ${updatedObj.nama} berhasil diperbarui.`);
          return;
        }

        const unitOrder = state.participants.filter(p => isKelasMA(p.kelas_sekolah) === isMA).length + 1;
        const finalNoPeserta = (rawNo.startsWith('P30020170') || rawNo.startsWith('U30020081'))
          ? rawNo
          : formatExamParticipantNumber(kelasSekolah, unitOrder);

        const pObj = {
          id: `pst - ${Date.now()} `,
          no_peserta: finalNoPeserta,
          nama: f.nama.value.trim(),
          gender: f.gender.value,
          kelas_sekolah: kelasSekolah,
          kelas_diniyyah: f.kelas_diniyyah.value.trim(),
          ruangan: f.ruangan.value,
          no_kursi: Number(f.no_kursi.value),
          hari_piket: f.hari_piket.value,
          password_peserta: "12345"
        };
        await saveParticipantToCloud(pObj);
        f.reset();
        notify(`Peserta ${pObj.nama} (${pObj.no_peserta}) berhasil ditambahkan ke ${pObj.ruangan}.`);
      },

      deleteParticipant: async (id) => {
        if (state.editingParticipantId === id) {
          state.editingParticipantId = null;
        }
        await deleteParticipantFromCloud(id);
        notify("Data peserta dihapus.");
      },

      addProctor: async (e) => {
        e.preventDefault();
        const f = e.target;
        const prObj = {
          id: `prc - ${Date.now()} `,
          kode: f.kode.value.trim(),
          nama: f.nama.value.trim(),
          jabatan: f.jabatan.value.trim()
        };
        await saveProctorToCloud(prObj);
        f.reset();
        notify(`Pengawas ${prObj.nama} berhasil ditambahkan.`);
      },

      deleteProctor: async (id) => {
        await deleteProctorFromCloud(id);
        notify("Data pengawas dihapus.");
      },

      updateDayDate: (day, val) => {
        if (state.schedules[day]) {
          state.schedules[day].tanggal = val;
        }
      },

      updateSlot: (day, slotIdx, field, val) => {
        if (state.schedules[day] && state.schedules[day].slots[slotIdx]) {
          state.schedules[day].slots[slotIdx][field] = val;
          const s = state.schedules[day].slots[slotIdx];
          s.mapel = `${s.mapel_ma || ''} / ${s.mapel_mts || ''}`;
          renderApp();
        }
      },

      saveSchedules: async () => {
        await saveMainSettingsToCloud();
      },

      autoAssignProctors: () => generateAutoProctorSchedule(),

      setProctorSlot: async (key, which, val) => {
        if (!state.proctorAssignments[key]) {
          state.proctorAssignments[key] = { p1: '-' };
        }
        state.proctorAssignments[key][which] = val;
        await saveMainSettingsToCloud();
      },

      saveTatib: async () => {
        const pText = document.getElementById('input-tatib-peserta')?.value || '';
        const gText = document.getElementById('input-tatib-pengawas')?.value || '';
        state.settings.tataTertibPeserta = pText.split('\n').map(s => s.trim()).filter(Boolean);
        state.settings.tataTertibPengawas = gText.split('\n').map(s => s.trim()).filter(Boolean);
        await saveMainSettingsToCloud();
      },

      toggleDigitalSig: async (checked) => {
        state.settings.gunakanTtdDigital = Boolean(checked);
        await saveMainSettingsToCloud();
      },

      uploadSignature: (event, fieldKey) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          state.settings[fieldKey] = ev.target.result;
          await saveMainSettingsToCloud();
          notify("Gambar Tanda Tangan Digital berhasil diperbarui.");
        };
        reader.readAsDataURL(file);
      },

      uploadLogoInstansi: (event) => {
        const file = event.target.files?.[0];
        if (!file) return;
        const reader = new FileReader();
        reader.onload = async (ev) => {
          state.settings.logoInstansi = ev.target.result;
          await saveMainSettingsToCloud();
          notify("Logo Kop & Cover berhasil diperbarui.");
        };
        reader.readAsDataURL(file);
      },

      resetLogoInstansi: async () => {
        state.settings.logoInstansi = "";
        await saveMainSettingsToCloud();
        notify("Logo dikembalikan ke logo default Pondok Pesantren At Tahiyyah.");
      },

      saveKopSettings: async (e) => {
        e.preventDefault();
        const f = e.target;
        state.settings.yayasan = f.yayasan.value.trim();
        state.settings.instansi = f.instansi.value.trim();
        state.settings.alamat = f.alamat.value.trim();
        state.settings.namaUjian = f.namaUjian.value.trim();
        state.settings.tahunAjaran = f.tahunAjaran.value.trim();
        state.settings.semester = f.semester.value.trim();
        state.settings.kepalaMA = f.kepalaMA.value.trim();
        state.settings.nipKepalaMA = f.nipKepalaMA.value.trim();
        state.settings.kepalaSekolah = state.settings.kepalaMA;
        state.settings.nipKepala = state.settings.nipKepalaMA;
        state.settings.kepalaMTS = f.kepalaMTS.value.trim();
        state.settings.nipKepalaMTS = f.nipKepalaMTS.value.trim();
        state.settings.kepalaDiniyyah = f.kepalaDiniyyah.value.trim();
        state.settings.nipKepalaDiniyyah = f.nipKepalaDiniyyah.value.trim();
        state.settings.ketuaPanitia = f.ketuaPanitia.value.trim();
        state.settings.nipKetua = f.nipKetua.value.trim();
        state.settings.kotaTanggal = f.kotaTanggal.value.trim();
        await saveMainSettingsToCloud();
      }
    };

    // Jalankan Aplikasi
    window.onload = () => {
      if (IS_PREVIEW) {
        initPreviewData();
        renderApp();
      } else {
        initFirebaseProduction();
        renderApp();
      }
    };
  </script>
</body>

</html>
