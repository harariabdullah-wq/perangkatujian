    // Konversi angka ke kode Abjad A - ZZ (1 -> A, 26 -> Z, 27 -> AA, 28 -> AB, dst.)
    function getAlphabetCode(num) {
      let s = '';
      while (num > 0) {
        let mod = (num - 1) % 26;
        s = String.fromCharCode(65 + mod) + s;
        num = Math.floor((num - 1) / 26);
      }
      return s;
    }

    // Generator Jadwal Pengawas Otomatis: 12 Ruangan Terisi Penuh, Tanpa Bentrok
    // Ketentuan: Sesi 1-3 diisi Guru Sekolah (MTs/MA), Sesi 4 diisi Guru Diniyyah
    function generateProctorScheduleMatrix(proctorsList) {
      const proctors = (proctorsList && proctorsList.length > 0) ? proctorsList : DEFAULT_IMAGE_PROCTORS;

      // Pisahkan Guru Sekolah dan Guru Diniyyah
      let sekolah = proctors.filter(p => !/diniyyah/i.test(p.jabatan || ''));
      let diniyyah = proctors.filter(p => /diniyyah/i.test(p.jabatan || ''));

      // Fallback proporsional jika jabatan tidak tertera
      if (diniyyah.length === 0) {
        if (proctors.length > 12) {
          sekolah = proctors.slice(0, proctors.length - 12);
          diniyyah = proctors.slice(proctors.length - 12);
        } else {
          sekolah = [...proctors];
          diniyyah = [...proctors];
        }
      }

      if (sekolah.length === 0) {
        sekolah = [...proctors];
      }

      const days = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];
      const matrix = {};

      let ptrSekolah = 0;
      let ptrDiniyyah = 0;

      days.forEach((day) => {
        matrix[day] = {};

        // Sesi 1, 2, 3: Guru Sekolah (12 ruangan terisi penuh & TIDAK BENTROK dalam 1 sesi)
        for (let sesi = 1; sesi <= 3; sesi++) {
          const assignedThisSession = [];
          const assignedCodes = new Set();

          for (let r = 0; r < 12; r++) {
            let attempts = 0;
            let chosen = null;
            while (attempts < sekolah.length) {
              const candidate = sekolah[(ptrSekolah + attempts) % sekolah.length];
              if (!assignedCodes.has(candidate.kode)) {
                chosen = candidate;
                ptrSekolah = (ptrSekolah + attempts + 1) % sekolah.length;
                break;
              }
              attempts++;
            }

            if (!chosen) {
              chosen = sekolah[ptrSekolah % sekolah.length];
              ptrSekolah = (ptrSekolah + 1) % sekolah.length;
            }

            assignedCodes.add(chosen.kode);
            assignedThisSession.push(chosen.kode);
          }

          matrix[day][sesi] = assignedThisSession;
        }

        // Sesi 4: Guru Diniyyah (12 ruangan terisi penuh & TIDAK BENTROK dalam Sesi 4)
        const assignedSesi4 = [];
        const assignedDiniyyahCodes = new Set();

        for (let r = 0; r < 12; r++) {
          let attempts = 0;
          let chosen = null;
          while (attempts < diniyyah.length) {
            const candidate = diniyyah[(ptrDiniyyah + attempts) % diniyyah.length];
            if (!assignedDiniyyahCodes.has(candidate.kode)) {
              chosen = candidate;
              ptrDiniyyah = (ptrDiniyyah + attempts + 1) % diniyyah.length;
              break;
            }
            attempts++;
          }

          if (!chosen) {
            chosen = diniyyah[ptrDiniyyah % diniyyah.length];
            ptrDiniyyah = (ptrDiniyyah + 1) % diniyyah.length;
          }

          assignedDiniyyahCodes.add(chosen.kode);
          assignedSesi4.push(chosen.kode);
        }

        matrix[day][4] = assignedSesi4;
        // Rotasi giliran penempatan ruang untuk hari berikutnya
        ptrDiniyyah = (ptrDiniyyah + 1) % diniyyah.length;
      });

      return matrix;
    }

    async function initFirebaseProduction() {
      if (IS_PREVIEW) return;
      try {
        const resolvedConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : firebaseConfig;
        app = initializeApp(resolvedConfig);
        auth = getAuth(app);
        db = getFirestore(app);

        if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) {
          await signInWithCustomToken(auth, __initial_auth_token);
        }

        onAuthStateChanged(auth, (user) => {
          if (user && !user.isAnonymous) {
            state.isAuthenticated = true;
            state.userRole = 'admin';
            state.currentUser = { email: user.email, uid: user.uid, name: 'Administrator Panitia' };
            subscribeFirestoreCollections();
          } else {
            if (state.userRole !== 'peserta') {
              state.isAuthenticated = false;
              state.currentUser = null;
            }
          }
          renderApp();
        });
      } catch (err) {
        notify("Gagal menginisialisasi koneksi Firebase: " + err.message, "error");
      }
    }

    function subscribeFirestoreCollections() {
      if (IS_PREVIEW || !db) return;

      const settingsRef = doc(db, 'artifacts', appId, 'public', 'data', 'exam_settings', 'main');
      unsubSettings = onSnapshot(settingsRef, (snap) => {
        if (snap.exists()) {
          const data = snap.data();
          if (data.settings) state.settings = data.settings;
          if (data.schedules) state.schedules = data.schedules;
          if (data.proctorAssignments) state.proctorAssignments = data.proctorAssignments;
          if (data.proctorMatrix) state.proctorMatrix = data.proctorMatrix;
          if (data.lastSavedProctorSchedule) state.lastSavedProctorSchedule = data.lastSavedProctorSchedule;
          if (data.ujianSusulan && Array.isArray(data.ujianSusulan)) {
            state.ujianSusulan = data.ujianSusulan;
            try {
              localStorage.setItem('myassessment_ujian_susulan', JSON.stringify(data.ujianSusulan));
            } catch (e) { }
          }
          renderApp();
        }
      }, (err) => notify("Gagal memuat pengaturan: " + err.message, "error"));

      const partCol = collection(db, 'artifacts', appId, 'public', 'data', 'participants');
      unsubParticipants = onSnapshot(partCol, (snap) => {
        const list = [];
        snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
        list.sort((a, b) => (a.no_peserta || '').localeCompare(b.no_peserta || ''));
        state.participants = list;
        renderApp();
      }, (err) => notify("Gagal memuat data peserta: " + err.message, "error"));

      const procCol = collection(db, 'artifacts', appId, 'public', 'data', 'proctors');
      unsubProctors = onSnapshot(procCol, (snap) => {
        const list = [];
        snap.forEach((d) => list.push({ id: d.id, ...d.data() }));
        list.sort((a, b) => (a.kode || '').localeCompare(b.kode || ''));
        state.proctors = list;
        renderApp();
      }, (err) => notify("Gagal memuat data pengawas: " + err.message, "error"));
    }

    function isKelasMA(kelasStr = '') {
      const u = String(kelasStr).toUpperCase().trim();
      if (u.includes('MTS')) return false;
      if (u.includes('MA') || u.includes('XI') || u.includes('XII') || /^X(\b|-|\s|[A-Z0-9])/i.test(u) || u.startsWith('10') || u.startsWith('11') || u.startsWith('12')) {
        return true;
      }
      return false;
    }

    function isKelasMTS(kelasStr = '') {
      const u = String(kelasStr).toUpperCase().trim();
      if (u.includes('MTS') || u.includes('VII') || u.includes('VIII') || u.includes('IX') || u.startsWith('7') || u.startsWith('8') || u.startsWith('9')) {
        return true;
      }
      return !isKelasMA(kelasStr);
    }

    // Generator Nomor Peserta Otomatis:
    // - MTs diawali P30020170 + urutan absen peserta (contoh: P30020170001)
    // - MA diawali U30020081 + urutan absen peserta (contoh: U30020081001)
    function formatExamParticipantNumber(kelasSekolah, orderNum) {
      const prefix = isKelasMA(kelasSekolah) ? 'U30020081' : 'P30020170';
      const suffix = String(orderNum).padStart(3, '0');
      return `${prefix}${suffix}`;
    }

    async function regenerateAllParticipantNumbers() {
      if (state.participants.length === 0) {
        notify("Belum ada data peserta untuk di-generate nomor pesertanya.", "error");
        return;
      }

      const listMA = state.participants
        .filter(p => isKelasMA(p.kelas_sekolah))
        .sort((a, b) => (a.kelas_sekolah || '').localeCompare(b.kelas_sekolah || '') || (a.nama || '').localeCompare(b.nama || ''));

    async function distributeTo12RoomsAndSeats() {
      if (state.participants.length === 0) {
        notify("Belum ada data peserta. Silakan impor dari Excel atau tambah peserta terlebih dahulu.", "error");
        return;
      }

      let maCounter = 0;
      let mtsCounter = 0;

      const sortedForAbsen = [...state.participants].sort((a, b) =>
        (a.kelas_sekolah || '').localeCompare(b.kelas_sekolah || '') || (a.nama || '').localeCompare(b.nama || '')
      );

      const numberedMap = {};
      sortedForAbsen.forEach(p => {
        if (isKelasMA(p.kelas_sekolah)) {
          maCounter++;
          numberedMap[p.id] = formatExamParticipantNumber('MA', maCounter);
        } else {
          mtsCounter++;
          numberedMap[p.id] = formatExamParticipantNumber('MTs', mtsCounter);
        }
      });

      // Fungsi penyusun selang-seling kelas (Greedy + Matriks 2D Anti-Sebelahan):
      // Memastikan di dalam 1 ruangan, peserta dengan kelas_sekolah atau kelas_diniyyah yang sama
      // dipisahkan oleh minimal 1 kelas yang berbeda (tidak berurutan dan tidak bersebelahan kiri-kanan / depan-belakang)
      const arrangeAntiAdjacentClassInRoom = (roomParticipants, cols = 4) => {
        const buckets = {};
        roomParticipants.forEach(p => {
          const clsKey = (p.kelas_sekolah || 'UMUM').trim().toUpperCase();
          if (!buckets[clsKey]) buckets[clsKey] = [];
          buckets[clsKey].push(p);
        });

        const total = roomParticipants.length;
        const placed = [];

        for (let pos = 0; pos < total; pos++) {
          const prevLeft = (pos % cols !== 0) ? placed[pos - 1] : null;
          const prevSeq = pos > 0 ? placed[pos - 1] : null;
          const prevTop = (pos >= cols) ? placed[pos - cols] : null;

          // Urutkan kelas yang masih memiliki sisa peserta terbanyak agar tidak menumpuk di akhir
          const availableKeys = Object.keys(buckets)
            .filter(k => buckets[k].length > 0)
            .sort((a, b) => buckets[b].length - buckets[a].length);

          // Prioritas 1: Berbeda kelas_sekolah & kelas_diniyyah dari kursi sebelumnya (kiri/urut) DAN kursi depan (atas)
          let chosenKey = availableKeys.find(k => {
            const candidate = buckets[k][0];
            const diffFromSeq = !prevSeq || (candidate.kelas_sekolah !== prevSeq.kelas_sekolah && candidate.kelas_diniyyah !== prevSeq.kelas_diniyyah);
            const diffFromLeft = !prevLeft || (candidate.kelas_sekolah !== prevLeft.kelas_sekolah);
            const diffFromTop = !prevTop || (candidate.kelas_sekolah !== prevTop.kelas_sekolah);
            return diffFromSeq && diffFromLeft && diffFromTop;
          });

          // Prioritas 2: Berbeda kelas_sekolah dari kursi sebelumnya (dipisah minimal 1 kelas berbeda) & berbeda dari atas
          if (!chosenKey) {
            chosenKey = availableKeys.find(k => {
              const candidate = buckets[k][0];
              const diffFromSeq = !prevSeq || candidate.kelas_sekolah !== prevSeq.kelas_sekolah;
              const diffFromTop = !prevTop || candidate.kelas_sekolah !== prevTop.kelas_sekolah;
              return diffFromSeq && diffFromTop;
            });
          }

          // Prioritas 3: Minimal wajib berbeda kelas_sekolah dari kursi tepat sebelumnya (dipisah 1 kelas berbeda)
          if (!chosenKey) {
            chosenKey = availableKeys.find(k => {
              const candidate = buckets[k][0];
              return !prevSeq || candidate.kelas_sekolah !== prevSeq.kelas_sekolah;
            });
          }

          // Fallback jika di akhir hanya tersisa 1 jenis kelas
          if (!chosenKey) {
            chosenKey = availableKeys[0];
          }

          placed.push(buckets[chosenKey].shift());
        }

        return placed;
      };

      // Utamakan pengelompokan berdasarkan Gender terlebih dahulu (Putra L dan Putri P dipisah)
      const males = state.participants
        .filter(p => p.gender === 'L')
        .sort((a, b) => (a.kelas_sekolah || '').localeCompare(b.kelas_sekolah || '') || (a.nama || '').localeCompare(b.nama || ''));
      const females = state.participants
        .filter(p => p.gender === 'P')
        .sort((a, b) => (a.kelas_sekolah || '').localeCompare(b.kelas_sekolah || '') || (a.nama || '').localeCompare(b.nama || ''));

      const roomBuckets = {};
      ROOM_LIST.forEach(r => roomBuckets[r] = []);

      // Helper untuk membagi daftar peserta ber-gender sama ke daftar ruangan secara merata per kelas,
      // lalu menyusun kursi di tiap ruangan agar kelas yang sama selalu dipisah oleh kelas berbeda
      const distributeGenderGroupToRooms = (groupList, targetRooms) => {
        if (groupList.length === 0 || targetRooms.length === 0) return;

        // Kelompokkan per kelas terlebih dahulu agar tiap ruangan mendapat variasi kelas yang seimbang
        const byClass = {};
        groupList.forEach(p => {
          const k = (p.kelas_sekolah || 'UMUM').trim().toUpperCase();
          if (!byClass[k]) byClass[k] = [];
          byClass[k].push(p);
        });

        let rCounter = 0;
        Object.keys(byClass).forEach(clsKey => {
          byClass[clsKey].forEach(p => {
            const roomName = targetRooms[rCounter % targetRooms.length];
            roomBuckets[roomName].push(p);
            rCounter++;
          });
        });
      };

      // Pemisahan Ruangan Dinamis Sesuai Menu Pengaturan: default 6 Putra & 6 Putri
      const maleCount = Math.max(1, Math.min(11, Number(state.maleRoomCount) || 7));
      const maleRooms = ROOM_LIST.slice(0, maleCount);
      const femaleRooms = ROOM_LIST.slice(maleCount);

      distributeGenderGroupToRooms(males, maleRooms);
      distributeGenderGroupToRooms(females, femaleRooms);

      const cols = Number(state.columnsPerRoom) || 4;
      const updatedList = [];

      for (const roomName of ROOM_LIST) {
        const rawInRoom = roomBuckets[roomName];
        // Pisahkan berdasarkan Gender terlebih dahulu di dalam ruangan, lalu susun selang-seling kelas
        const roomMales = arrangeAntiAdjacentClassInRoom(rawInRoom.filter(p => p.gender === 'L'), cols);
        const roomFemales = arrangeAntiAdjacentClassInRoom(rawInRoom.filter(p => p.gender === 'P'), cols);
        const finalOrderedRoom = [...roomMales, ...roomFemales];

        finalOrderedRoom.forEach((p, idx) => {
          const seatNumber = idx + 1;
          const piketDay = DAY_LIST[idx % DAY_LIST.length];
          const noPesertaFormatted = numberedMap[p.id] || formatExamParticipantNumber(p.kelas_sekolah, idx + 1);

          const updated = {
            ...p,
            no_peserta: noPesertaFormatted,
            ruangan: roomName,
            no_kursi: seatNumber,
            hari_piket: piketDay
          };
          updatedList.push(updated);
        });
      }

      state.participants = updatedList;
      if (!IS_PREVIEW && db && state.isAuthenticated) {
        for (const p of updatedList) {
          await saveParticipantToCloud(p);
        }
      }
      notify(`Distribusi selesai: Mengutamakan Gender (L/P) terlebih dahulu, dan kelas yang sama telah dipisah dengan kelas berbeda di seluruh 12 ruangan.`);
      renderApp();
    }

    async function generateAutoProctorSchedule() {
      if (state.proctors.length === 0) {
        notify("Tambahkan minimal 1 nama Pengawas terlebih dahulu sebelum men-generate jadwal pengawas.", "error");
        return;
      }

      const assignments = {};
      let offset = 0;
      DAY_LIST.forEach((hari, dIdx) => {
        const slots = state.schedules[hari]?.slots || [];
        slots.forEach((slot, sIdx) => {
          ROOM_LIST.forEach((ruang, rIdx) => {
            const p1Idx = (rIdx + dIdx + sIdx + offset) % state.proctors.length;
            const p1 = state.proctors[p1Idx]?.nama || "-";
            assignments[`${hari}_${slot.sesi}_${ruang}`] = { p1 };
          });
          offset++;
        });
      });

      state.proctorAssignments = assignments;
      await saveMainSettingsToCloud();
      notify("Jadwal Pengawas Ujian (1 Ruangan = 1 Pengawas) berhasil disusun otomatis.");
    }

    function handleProctorExcelUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });
          const sheetName = workbook.SheetNames.find(n => n.toLowerCase().includes('pengawas')) || workbook.SheetNames[0];
          const pRows = XLSX.utils.sheet_to_json(workbook.Sheets[sheetName], { defval: "" });

          let importedProctors = 0;
          for (let j = 0; j < pRows.length; j++) {
            const pr = pRows[j];
            const namaPengawas = String(
              pr["Nama"] || pr["Nama Pengawas"] || pr.Nama_Pengawas || pr.nama || pr.NAMA || ""
            ).trim();
            if (!namaPengawas) continue;

            const kodePengawas = String(
              pr["Kode Pengawas"] || pr.Kode_Pengawas || pr.Kode || pr.kode || `PGW-${String(state.proctors.length + importedProctors + 1).padStart(2, '0')}`
            ).trim();

            const jabatanPengawas = String(
              pr["Jabatan"] || pr.jabatan || pr.Mapel || "Pengawas Ruang"
            ).trim();

            const prObj = {
              id: `prc-${Date.now()}-${j}`,
              kode: kodePengawas,
              nama: namaPengawas,
              jabatan: jabatanPengawas
            };
            await saveProctorToCloud(prObj);
            importedProctors++;
          }

          event.target.value = "";
          notify(`Berhasil mengimpor ${importedProctors} data Pengawas dari file Excel.`);
          renderApp();
        } catch (err) {
          notify("Gagal membaca file Excel Pengawas: " + err.message, "error");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function handleExcelUpload(event) {
      const file = event.target.files?.[0];
      if (!file) return;

      const reader = new FileReader();
      reader.onload = async (e) => {
        try {
          const data = new Uint8Array(e.target.result);
          const workbook = XLSX.read(data, { type: 'array' });

          let importedParticipants = 0;
          let importedProctors = 0;
          let maCount = state.participants.filter(p => isKelasMA(p.kelas_sekolah)).length;
          let mtsCount = state.participants.filter(p => !isKelasMA(p.kelas_sekolah)).length;

          const pesertaSheetName = workbook.SheetNames.find(n => n.toLowerCase().includes('peserta')) || workbook.SheetNames[0];
          if (pesertaSheetName) {
            const rows = XLSX.utils.sheet_to_json(workbook.Sheets[pesertaSheetName], { defval: "" });
            for (let i = 0; i < rows.length; i++) {
              const r = rows[i];
              if ((r["Kode Pengawas"] || r.Kode_Pengawas) && !r.Kelas_Sekolah && !r.Kelas) {
                const namaPgw = String(r["Nama"] || r["Nama Pengawas"] || r.Nama_Pengawas || "").trim();
                if (namaPgw) {
                  await saveProctorToCloud({
                    id: `prc-${Date.now()}-${i}`,
                    kode: String(r["Kode Pengawas"] || r.Kode_Pengawas || `PGW-${state.proctors.length + 1}`).trim(),
                    nama: namaPgw,
                    jabatan: String(r["Jabatan"] || r.Jabatan || "Pengawas Ruang").trim()
                  });
                  importedProctors++;
                }
                continue;
              }

              const nama = String(r.Nama_Lengkap || r.Nama || r.nama || r.NAMA || "").trim();
              if (!nama) continue;

              const rawGender = String(r.Jenis_Kelamin || r.JK || r.Gender || r.gender || "L").trim().toUpperCase();
              const gender = (rawGender.startsWith("P") || rawGender.startsWith("W")) ? "P" : "L";
              const kelasSekolah = String(r.Kelas_Sekolah || r.Kelas || r.kelas_sekolah || "MTs IX-A").trim();
              const kelasDiniyyah = String(r.Kelas_Diniyyah || r.Diniyyah || r.kelas_diniyyah || "Wustho 3A").trim();
              const roomIdx = i % 12;
              const defaultRoom = ROOM_LIST[roomIdx];
              const ruangan = String(r.Ruangan || r.ruangan || defaultRoom).trim();
              const noKursi = Number(r.No_Kursi || r.Kursi || (Math.floor(i / 12) + 1));
              const hariPiket = String(r.Hari_Piket || r.Piket || DAY_LIST[i % 6]).trim();

              let orderAbsen = Number(r.No_Urut_Absen || r.Absen || r.Urutan || 0);
              if (!orderAbsen) {
                if (isKelasMA(kelasSekolah)) {
                  maCount++;
                  orderAbsen = maCount;
                } else {
                  mtsCount++;
                  orderAbsen = mtsCount;
                }
              }

              const autoNoPeserta = formatExamParticipantNumber(kelasSekolah, orderAbsen);
              const rawNoPeserta = String(r.No_Peserta || r.Nomor_Peserta || "").trim();
              const noPeserta = (rawNoPeserta.startsWith('P30020170') || rawNoPeserta.startsWith('U30020081'))
                ? rawNoPeserta
                : autoNoPeserta;

              const pObj = {
                id: `pst-${Date.now()}-${i}`,
                no_peserta: noPeserta,
                nama,
                gender,
                kelas_sekolah: kelasSekolah,
                kelas_diniyyah: kelasDiniyyah,
                ruangan: ROOM_LIST.includes(ruangan) ? ruangan : defaultRoom,
                no_kursi: noKursi,
                hari_piket: DAY_LIST.includes(hariPiket) ? hariPiket : DAY_LIST[i % 6],
                password_peserta: String(r.Password || "12345")
              };
              await saveParticipantToCloud(pObj);
              importedParticipants++;
            }
          }

          const pengawasSheetName = workbook.SheetNames.find(n => n.toLowerCase().includes('pengawas'));
          if (pengawasSheetName) {
            const pRows = XLSX.utils.sheet_to_json(workbook.Sheets[pengawasSheetName], { defval: "" });
            for (let j = 0; j < pRows.length; j++) {
              const pr = pRows[j];
              const namaPengawas = String(pr["Nama"] || pr["Nama Pengawas"] || pr.Nama_Pengawas || pr.nama || "").trim();
              if (!namaPengawas) continue;
              const prObj = {
                id: `prc-${Date.now()}-${j}`,
                kode: String(pr["Kode Pengawas"] || pr.Kode_Pengawas || pr.Kode || `PGW-${String(state.proctors.length + j + 1).padStart(2, '0')}`).trim(),
                nama: namaPengawas,
                jabatan: String(pr["Jabatan"] || pr.Jabatan || pr.Mapel || "Pengawas Ruang").trim()
              };
              await saveProctorToCloud(prObj);
              importedProctors++;
            }
          }

          event.target.value = "";
          notify(`Impor Excel selesai: ${importedParticipants} Peserta & ${importedProctors} Pengawas berhasil dimuat.`);
          renderApp();
        } catch (err) {
          notify("Format file Excel tidak valid: " + err.message, "error");
        }
      };
      reader.readAsArrayBuffer(file);
    }

    function getRoomGenderDesignation(roomName) {
      const inRoom = state.participants.filter(p => p.ruangan === roomName);
      if (inRoom.length > 0) {
        const lCount = inRoom.filter(p => p.gender === 'L').length;
        const pCount = inRoom.filter(p => p.gender === 'P').length;
        if (lCount > 0 && pCount === 0) return 'L';
        if (pCount > 0 && lCount === 0) return 'P';
        if (lCount >= pCount) return 'L';
        return 'P';
      }
      const roomNum = parseInt(String(roomName).replace(/\D+/g, ''), 10) || 1;
      const maleCutoff = Math.max(1, Math.min(11, Number(state.maleRoomCount) || 7));
      return roomNum <= maleCutoff ? 'L' : 'P';
    }

    function getRoomParticipants(roomName) {
      const expectedGender = getRoomGenderDesignation(roomName);
      return state.participants
        .filter(p => p.ruangan === roomName && p.gender === expectedGender)
        .sort((a, b) => (Number(a.no_kursi) || 0) - (Number(b.no_kursi) || 0));
    }

    function getUniqueClasses(type = 'MA') {
      const set = new Set();
      state.participants.forEach(p => {
        if (type === 'DINIYYAH') {
          if (p.kelas_diniyyah) set.add(p.kelas_diniyyah);
        } else if (type === 'MA') {
          if (p.kelas_sekolah && isKelasMA(p.kelas_sekolah)) set.add(p.kelas_sekolah);
        } else if (type === 'MTS') {
          if (p.kelas_sekolah && isKelasMTS(p.kelas_sekolah)) set.add(p.kelas_sekolah);
        }
      });
      const arr = Array.from(set).sort();
      if (arr.length > 0) return arr;
      if (type === 'DINIYYAH') return ['Wustho 1A', 'Wustho 2A', 'Wustho 3A'];
      if (type === 'MA') return ['MA X-A'];
      return ['MTs IX-A'];
    }

    function getSchoolClassSortKey(className) {
      const s = String(className || '').toUpperCase().trim();
      let stage = 3;
      if (s.includes('MTS')) {
        stage = 1;
      } else if (s.includes('MA') && !s.includes('MTS') && !s.includes('MADRASAH')) {
        stage = 2;
      }

      let grade = 99;
      if (/\b12\b|12[A-Z]|XII/i.test(s)) {
        grade = 12;
        if (stage === 3) stage = 2;
      } else if (/\b11\b|11[A-Z]|XI/i.test(s)) {
        grade = 11;
        if (stage === 3) stage = 2;
      } else if (/\b10\b|10[A-Z]|\bX\b/i.test(s)) {
        grade = 10;
        if (stage === 3) stage = 2;
      } else if (/\b9\b|9[A-Z]|IX/i.test(s)) {
        grade = 9;
        if (stage === 3) stage = 1;
      } else if (/\b8\b|8[A-Z]|VIII/i.test(s)) {
        grade = 8;
        if (stage === 3) stage = 1;
      } else if (/\b7\b|7[A-Z]|VII/i.test(s)) {
        grade = 7;
        if (stage === 3) stage = 1;
      } else {
        const num = s.match(/\d+/);
        if (num) {
          const n = parseInt(num[0], 10);
          if (n >= 7 && n <= 9) { grade = n; stage = 1; }
          else if (n >= 10 && n <= 12) { grade = n; stage = 2; }
          else { grade = n; }
        }
      }
      return stage * 1000 + grade * 10;
    }

    function getDiniyyahClassSortKey(className) {
      const s = String(className || '').toUpperCase().trim();
      let level = 4;
      if (s.includes('ULA') && !s.includes('WUSTHO') && !s.includes('ULYA')) {
        level = 1;
      } else if (s.includes('WUSTHO') || s.includes('WUSTHA')) {
        level = 2;
      } else if (s.includes('ULYA')) {
        level = 3;
      }

      let grade = 0;
      if (/\b3\b|3[A-Z]|III/i.test(s)) grade = 3;
      else if (/\b2\b|2[A-Z]|II/i.test(s)) grade = 2;
      else if (/\b1\b|1[A-Z]|\bI\b/i.test(s)) grade = 1;
      else {
        const num = s.match(/\d+/);
        if (num) grade = parseInt(num[0], 10);
      }
      return level * 1000 + grade * 10;
    }

    function getSchoolClassesList() {
      const set = new Set();
      state.participants.forEach(p => {
        if (p.kelas_sekolah) set.add(p.kelas_sekolah.trim());
      });
      if (set.size === 0) {
        return ['7A MTS', '8A MTS', '9A MTS', '9B MTS', '10A MA', '11 MA', '12A MA'];
      }
      const hasDefault = ['7A MTS', '8A MTS', '9A MTS', '10A MA'].some(c => set.has(c));
      if (hasDefault) {
        ['7A MTS', '8A MTS', '9A MTS', '9B MTS', '10A MA', '11 MA', '12A MA'].forEach(c => set.add(c));
      }
      const arr = Array.from(set);
      arr.sort((a, b) => {
        const kA = getSchoolClassSortKey(a), kB = getSchoolClassSortKey(b);
        if (kA !== kB) return kA - kB;
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
      });
      return arr;
    }

    function getDiniyyahClassesList() {
      const set = new Set();
      state.participants.forEach(p => {
        if (p.kelas_diniyyah) set.add(p.kelas_diniyyah.trim());
      });
      if (set.size === 0) {
        return ['1A ULA', '1B ULA', '2A ULA', '3A ULA', '1A WUSTHO', '2A WUSTHO', '3 WUSTHO'];
      }
      const hasDefault = ['1A ULA', '2A ULA', '1A WUSTHO'].some(c => set.has(c));
      if (hasDefault) {
        ['1A ULA', '1B ULA', '2A ULA', '3A ULA', '1A WUSTHO', '2A WUSTHO', '3 WUSTHO'].forEach(c => set.add(c));
      }
      const arr = Array.from(set);
      arr.sort((a, b) => {
        const kA = getDiniyyahClassSortKey(a), kB = getDiniyyahClassSortKey(b);
        if (kA !== kB) return kA - kB;
        return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
      });
      return arr;
    }

        const cls = rawCls.trim().replace(/ulya/gi, 'Wustho');

          ROOM_LIST.forEach(r => countsByClassAndRoom[cls][r] = 0);

        const r = p.ruangan && ROOM_LIST.includes(p.ruangan) ? p.ruangan : 'Ruang 01';
        countsByClassAndRoom[cls][r] = (countsByClassAndRoom[cls][r] || 0) + 1;

        roomTotals[r] = (roomTotals[r] || 0) + 1;

        return `

          ${renderRekapDiniyyahF4Sheet()}

      }

    function getSlotSubjectForClass(slot, classId) {
      if (!slot) return '-';
      switch (classId) {
        case 'MTS_7': return slot.mapel_mts_7 || slot.mapel_mts || slot.mapel || '-';
        case 'MTS_8': return slot.mapel_mts_8 || slot.mapel_mts || slot.mapel || '-';
        case 'MTS_9': return slot.mapel_mts_9 || slot.mapel_mts || slot.mapel || '-';
        case 'MA_10': return slot.mapel_ma_10 || slot.mapel_ma || slot.mapel || '-';
        case 'MA_11': return slot.mapel_ma_11 || slot.mapel_ma || slot.mapel || '-';
        case 'MA_12': return slot.mapel_ma_12 || slot.mapel_ma || slot.mapel || '-';
        default:
          if (typeof classId === 'string' && classId.startsWith('MTS')) return slot.mapel_mts || slot.mapel || '-';
          if (typeof classId === 'string' && classId.startsWith('MA')) return slot.mapel_ma || slot.mapel || '-';
          return slot.mapel || slot.mapel_ma || slot.mapel_mts || '-';
      }
    }

    function getSlotSubjectLabel(slot, target = 'ALL') {
      if (!slot) return '-';
      if (['MTS_7', 'MTS_8', 'MTS_9', 'MA_10', 'MA_11', 'MA_12'].includes(target)) {
        return getSlotSubjectForClass(slot, target);
      }
      if (target === 'MA_DINIYYAH') return slot.mapel_ma || slot.mapel_ma_10 || slot.mapel || '-';
      if (target === 'MTS_DINIYYAH') return slot.mapel_mts || slot.mapel_mts_7 || slot.mapel || '-';
      const ma = slot.mapel_ma || slot.mapel_ma_10 || slot.mapel || '-';
      const mts = slot.mapel_mts || slot.mapel_mts_7 || slot.mapel || '-';
      if (ma === mts) return ma;
      return `MA: ${ma} | MTs: ${mts}`;
    }

    // MODUL 2: PEMBUATAN 12 RUANGAN & DENAH TEMPAT DUDUK (L/P & KELAS)
    // ==========================================
    // REKAPITULASI JUMLAH SISWA RUANGAN (PUTRA / PUTRI)
    // ==========================================
    function renderRekapSiswaRuanganTable(roomName) {
      const roomList = getRoomParticipants(roomName);
      const roomGender = getRoomGenderDesignation(roomName);
      const roomNum = parseInt(String(roomName).replace(/\D+/g, ''), 10) || 1;
      const maleCutoff = Number(state.maleRoomCount) || 7;
      const isMaleRoom = roomGender ? (roomGender === 'L') : (roomNum <= maleCutoff);
      const targetGender = isMaleRoom ? 'L' : 'P';
      const genderBadge = isMaleRoom ? 'Putra' : 'Putri';

      // Hanya ambil peserta yang sesuai jenis kelamin ruangan (L untuk Putra, P untuk Putri)
      const roomStudents = (roomList || []).filter(p => p.gender === targetGender || (!p.gender && isMaleRoom));

      // Himpunan kelas yang dimiliki oleh santri dengan gender ini di seluruh madrasah
      const genderSchoolClasses = new Set();
      const genderDiniyyahClasses = new Set();
      (state.participants || []).forEach(p => {
        if (p.gender === targetGender) {
          if (p.kelas_sekolah && p.kelas_sekolah.trim()) genderSchoolClasses.add(p.kelas_sekolah.trim());
          if (p.kelas_diniyyah && p.kelas_diniyyah.trim()) genderDiniyyahClasses.add(p.kelas_diniyyah.trim().replace(/ulya/gi, 'Wustho'));
        }
      });

      const schoolCounts = {};
      const diniyyahCounts = {};
      roomStudents.forEach(p => {
        if (p.kelas_sekolah && p.kelas_sekolah.trim()) {
          const s = p.kelas_sekolah.trim();
          schoolCounts[s] = (schoolCounts[s] || 0) + 1;
        }
        if (p.kelas_diniyyah && p.kelas_diniyyah.trim()) {
          const d = p.kelas_diniyyah.trim().replace(/ulya/gi, 'Wustho');
          diniyyahCounts[d] = (diniyyahCounts[d] || 0) + 1;
        }
      });

      // Hanya tampilkan kelas laki-laki jika ruangan laki-laki, dan sebaliknya
      const activeSchoolClasses = Object.keys(schoolCounts)
        .filter(c => genderSchoolClasses.size === 0 || genderSchoolClasses.has(c))
        .sort((a, b) => {
          const kA = getSchoolClassSortKey(a), kB = getSchoolClassSortKey(b);
          if (kA !== kB) return kA - kB;
          return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
        });

      const activeDiniyyahClasses = Object.keys(diniyyahCounts)
        .filter(c => genderDiniyyahClasses.size === 0 || genderDiniyyahClasses.has(c))
        .sort((a, b) => {
          const kA = getDiniyyahClassSortKey(a), kB = getDiniyyahClassSortKey(b);
          if (kA !== kB) return kA - kB;
          return a.localeCompare(b, undefined, { numeric: true, sensitivity: 'base' });
        });

      let totalSekolah = 0;
      let totalDiniyyah = 0;
      activeSchoolClasses.forEach(c => totalSekolah += (schoolCounts[c] || 0));
      activeDiniyyahClasses.forEach(c => totalDiniyyah += (diniyyahCounts[c] || 0));

      if (activeSchoolClasses.length === 0 && activeDiniyyahClasses.length === 0) {
        return `
          <div style="margin: 6px 0; padding: 4px 8px; border: 1px dashed #94a3b8; font-size: 7.5pt; text-align: center; color: #64748b; font-style: italic; box-sizing: border-box; width: 100%;">
            (Belum ada data peserta ${genderBadge} di ${roomName})
          </div>
        `;
      }

      const schoolText = activeSchoolClasses.map(c => `<strong>${c}</strong>: ${schoolCounts[c]}`).join(', ');
      const diniyyahText = activeDiniyyahClasses.map(c => `<strong>${c}</strong>: ${diniyyahCounts[c]}`).join(', ');

      return `
        <div style="margin: 6px 0 10px 0; border: 1.5px solid #000000; padding: 4px 8px; font-size: 7.5pt; line-height: 1.35; background: #ffffff; page-break-inside: avoid; box-sizing: border-box; width: 100%;">
          <div style="font-weight: 800; font-size: 8pt; text-transform: uppercase; letter-spacing: 0.3px; border-bottom: 1px solid #000000; padding-bottom: 2px; margin-bottom: 3px;">
            RINCIAN JUMLAH PESERTA PER KELAS (${genderBadge.toUpperCase()})
          </div>
          <div style="display: flex; flex-direction: column; gap: 2px;">
            <div>
              <span style="font-weight: 800; text-decoration: underline;">SEKOLAH:</span> ${schoolText || '-'} &nbsp;<strong style="background: #f1f5f9; padding: 1px 4px; border: 1px solid #cbd5e1; border-radius: 2px;">[Total: ${totalSekolah}]</strong>
            </div>
            <div>
              <span style="font-weight: 800; text-decoration: underline;">DINIYYAH:</span> ${diniyyahText || '-'} &nbsp;<strong style="background: #f1f5f9; padding: 1px 4px; border: 1px solid #cbd5e1; border-radius: 2px;">[Total: ${totalDiniyyah}]</strong>
            </div>
          </div>
        </div>
      `;
    }

              title="Cetak seluruh 12 lembar sampul ruangan sekaligus ke printer"
            >
              <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 17h2a2 2 0 002-2v-4a2 2 0 00-2-2H5a2 2 0 00-2 2v4a2 2 0 002 2h2m2 4h6a2 2 0 002-2v-4a2 2 0 00-2-2H9a2 2 0 00-2 2v4a2 2 0 002 2zm8-12V5a2 2 0 00-2-2H9a2 2 0 00-2 2v4h10z" /></svg>
              Cetak Seluruhnya (12 Ruang)
            </button>
          </div>
        </div>

        <div id="print-mount">
          ${roomsToRender.map(roomName => {
        const roomList = getRoomParticipants(roomName);
        const roomGender = getRoomGenderDesignation(roomName);
        const roomNum = parseInt(String(roomName).replace(/\D+/g, ''), 10) || 1;
        const maleCutoff = Number(state.maleRoomCount) || 7;
        const isMaleRoom = roomGender ? (roomGender === 'L') : (roomNum <= maleCutoff);
        const targetGender = isMaleRoom ? 'L' : 'P';
        const genderLabel = isMaleRoom ? 'Putra (Laki-Laki)' : 'Putri (Perempuan)';

        // Kelas standar sekolah & diniyyah sesuai gender
        const stdMaleSchool = ['7A MTS', '8A MTS', '9A MTS', '9B MTS', '10A MA', '11 MA', '12A MA'];
        const stdMaleDini = ['1A ULA', '1B ULA', '2A ULA', '3A ULA', '1A WUSTHO', '2A WUSTHO', '3 WUSTHO'];

        const stdFemaleSchool = ['7B MTS', '8B MTS', '9B MTS', '9C MTS', '10B MA', '11 MA', '12B MA'];
        const stdFemaleDini = ['1B ULA', '2B ULA', '3B ULA', '1B WUSTHO', '2B WUSTHO', '3 WUSTHO'];

        // Kumpulkan himpunan kelas yang relevan untuk gender ruangan ini
        const genderSchoolSet = new Set(isMaleRoom ? stdMaleSchool : stdFemaleSchool);
        const genderDiniSet = new Set(isMaleRoom ? stdMaleDini : stdFemaleDini);

        (state.participants || []).forEach(p => {
          if (p.gender === targetGender || (!p.gender && isMaleRoom)) {
            if (p.kelas_sekolah && p.kelas_sekolah.trim()) {
              genderSchoolSet.add(p.kelas_sekolah.toUpperCase().trim());
            }
            if (p.kelas_diniyyah && p.kelas_diniyyah.trim()) {
              genderDiniSet.add(p.kelas_diniyyah.toUpperCase().trim().replace(/ULYA/gi, 'WUSTHO'));
            }
          }
        });

        const stdSchoolOrder = isMaleRoom
          ? ['7A MTS', '8A MTS', '9A MTS', '9B MTS', '10A MA', '11 MA', '12A MA', '12 MA']
          : ['7B MTS', '7C MTS', '8B MTS', '9B MTS', '9C MTS', '10B MA', '11 MA', '12B MA', '12 MA'];

        const stdDiniOrder = isMaleRoom
          ? ['1A ULA', '1B ULA', '2A ULA', '2B ULA', '3A ULA', '3B ULA', '1A WUSTHO', '1B WUSTHO', '2A WUSTHO', '2B WUSTHO', '3 WUSTHO', '3A WUSTHO']
          : ['1B ULA', '2B ULA', '3B ULA', '1B WUSTHO', '2B WUSTHO', '3 WUSTHO', '3B WUSTHO'];

        const activeSchoolClasses = Array.from(genderSchoolSet).sort((a, b) => {
          const idxA = stdSchoolOrder.indexOf(a);
          const idxB = stdSchoolOrder.indexOf(b);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return a.localeCompare(b);
        });

        const activeDiniClasses = Array.from(genderDiniSet).sort((a, b) => {
          const idxA = stdDiniOrder.indexOf(a);
          const idxB = stdDiniOrder.indexOf(b);
          if (idxA !== -1 && idxB !== -1) return idxA - idxB;
          if (idxA !== -1) return -1;
          if (idxB !== -1) return 1;
          return a.localeCompare(b);
        });

        const schoolCounts = {};
        roomList.forEach(p => {
          const cls = (p.kelas_sekolah || '').toUpperCase().trim();
          if (cls) schoolCounts[cls] = (schoolCounts[cls] || 0) + 1;
        });
        const schoolDisplayList = activeSchoolClasses.map(cls => ({
          name: cls,
          count: schoolCounts[cls] || 0
        }));

        const diniCounts = {};
        roomList.forEach(p => {
          const cls = (p.kelas_diniyyah || '').toUpperCase().trim().replace(/ULYA/gi, 'WUSTHO');
          if (cls) diniCounts[cls] = (diniCounts[cls] || 0) + 1;
        });
        const diniDisplayList = activeDiniClasses.map(cls => ({
          name: cls,
          count: diniCounts[cls] || 0
        }));

        // Filter peserta sesuai gender ruangan agar data 100% konsisten
        const validStudents = (roomList || []).filter(p => p.gender === targetGender || (!p.gender && isMaleRoom));
        const rowCount = Math.max(10, Math.ceil(validStudents.length / 2));
        const tableRows = [];
        for (let i = 0; i < rowCount; i++) {
          tableRows.push({
            left: validStudents[i] || null,
            right: validStudents[i + rowCount] || null
          });

        return `

                <div style="border: 2px solid #000000; padding: 7mm 8mm; width: 100%; height: 100%; min-height: 312mm; box-sizing: border-box; display: flex; flex-direction: column; justify-content: space-between;">

                      <div style="width: 90px; flex-shrink: 0; display: flex; align-items: center; justify-content: center;">
                        ${getAtTahiyyahLogoMarkup(84, 68)}
                      </div>
                      <div style="flex: 1; text-align: center; line-height: 1.22;">
                        <div style="font-size: 13pt; font-weight: 800; text-transform: uppercase; letter-spacing: 0.3px;">${s.yayasan || 'PONDOK PESANTREN AT TAHIYYAH'}</div>
                        <div style="font-size: 10.5pt; font-weight: 800; text-transform: uppercase;">PANITIA ${s.namaUjian || 'ASESMEN SUMATIF AKHIR SEMESTER GANJIL'}</div>
                        <div style="font-size: 10.5pt; font-weight: 800; text-transform: uppercase;">${s.namaMadrasah || 'MTs, MA DAN DINIYYAH AT TAHIYYAH'}</div>
                        <div style="font-size: 11pt; font-weight: 800; text-transform: uppercase;">TAHUN AJARAN ${s.tahunAjaran || '2025 / 2026'}</div>
                        <div style="font-size: 8pt; font-weight: 500; color: #1E293B; margin-top: 1.5px;">${s.alamat || 'Jl. KH Ahmad Dahlan Cantiga Kel. Petir Kec. Cipondoh Kota Tangerang'}</div>
                      </div>
                    </div>
                  </div>

                  <!-- Bagian 2: Logo Besar Pondok Pesantren (Lebih Besar Sesuai Request) -->
                  <div style="text-align: center; margin: 4px 0 2px 0;">
                    ${getAtTahiyyahLogoMarkup(230, 175)}
                  </div>

                  <!-- Bagian 3: Nama Ruangan -->
                  <div style="text-align: center; font-size: 40pt; font-weight: 900; letter-spacing: 3px; color: #000000; margin: 2px 0 8px 0; font-family: 'Plus Jakarta Sans', sans-serif; line-height: 1.1;">
                    ${roomName.toUpperCase()}
                  </div>

                  <!-- Bagian 4: Jumlah Peserta Pada Ruangan (Sekolah & Diniyyah Sesuai Gender) -->

                      ${schoolDisplayList.map(item => `
                        <div style="display: flex; justify-content: space-between; padding: 1px 0; font-weight: 700; font-size: 8.5pt;">
                          <span>${item.name}</span>
                          <span style="font-family: monospace; font-size: 9pt;">${item.count}</span>

                      `).join('')}
                    </div>

                    <!-- Kolom Diniyyah -->
                    <div style="flex: 1; max-width: 190px;">
                      <div style="font-weight: 800; text-align: center; margin-bottom: 4px; letter-spacing: 0.5px; border-bottom: 1.5px solid #000000; padding-bottom: 2px;">DINIYYAH</div>
                      ${diniDisplayList.map(item => `
                        <div style="display: flex; justify-content: space-between; padding: 1px 0; font-weight: 700; font-size: 8.5pt;">
                          <span>${item.name}</span>
                          <span style="font-family: monospace; font-size: 9pt;">${item.count}</span>
                        </div>
                      `).join('')}
                    </div>
                  </div>

                  <!-- Bagian 5: Tabel Nama-Nama Siswa Berdasarkan Ruangan (1 Sampul 1 Ruangan F4 Fit) -->
                  <div>
                    <div style="font-size: 7.8pt; font-weight: 800; text-align: center; margin-bottom: 3.5px; letter-spacing: 0.3px; text-transform: uppercase;">
                      DAFTAR PESERTA UJIAN — ${roomName.toUpperCase()} (${genderLabel.toUpperCase()})
                    </div>
                    <table style="width: 100%; border-collapse: collapse; font-size: 6.8pt; font-family: 'Plus Jakarta Sans', sans-serif; border: 1px solid #000000; table-layout: fixed;">
                      <thead>
                        <tr style="background: #F8FAFC; font-weight: 800;">
                          <th style="border: 1px solid #000000; padding: 2px 2px; width: 4%; text-align: center;">No</th>
                          <th style="border: 1px solid #000000; padding: 2px 3px; width: 28%; text-align: left;">Nama Peserta</th>
                          <th style="border: 1px solid #000000; padding: 2px 2px; width: 9%; text-align: center;">Sekolah</th>
                          <th style="border: 1px solid #000000; padding: 2px 2px; width: 9%; text-align: center;">Diniyyah</th>
                          <th style="border: 1px solid #000000; padding: 2px 2px; width: 4%; text-align: center;">No</th>
                          <th style="border: 1px solid #000000; padding: 2px 3px; width: 28%; text-align: left;">Nama Peserta</th>
                          <th style="border: 1px solid #000000; padding: 2px 2px; width: 9%; text-align: center;">Sekolah</th>
                          <th style="border: 1px solid #000000; padding: 2px 2px; width: 9%; text-align: center;">Diniyyah</th>
                        </tr>
                      </thead>
                      <tbody>
                        ${tableRows.map((r, idx) => `
                          <tr>
                            <td style="border: 1px solid #000000; padding: 1.5px 2px; text-align: center; font-weight: 700;">${r.left ? (idx + 1) : '&nbsp;'}</td>
                            <td style="border: 1px solid #000000; padding: 1.5px 3px; text-align: left; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${r.left ? r.left.nama : '&nbsp;'}</td>
                            <td style="border: 1px solid #000000; padding: 1.5px 2px; text-align: center; white-space: nowrap;">${r.left ? r.left.kelas_sekolah : '&nbsp;'}</td>
                            <td style="border: 1px solid #000000; padding: 1.5px 2px; text-align: center; white-space: nowrap;">${r.left ? (r.left.kelas_diniyyah || '-').replace(/ulya/gi, 'Wustho') : '&nbsp;'}</td>
                            <td style="border: 1px solid #000000; padding: 1.5px 2px; text-align: center; font-weight: 700;">${r.right ? (idx + rowCount + 1) : '&nbsp;'}</td>
                            <td style="border: 1px solid #000000; padding: 1.5px 3px; text-align: left; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;">${r.right ? r.right.nama : '&nbsp;'}</td>
                            <td style="border: 1px solid #000000; padding: 1.5px 2px; text-align: center; white-space: nowrap;">${r.right ? r.right.kelas_sekolah : '&nbsp;'}</td>
                            <td style="border: 1px solid #000000; padding: 1.5px 2px; text-align: center; white-space: nowrap;">${r.right ? (r.right.kelas_diniyyah || '-').replace(/ulya/gi, 'Wustho') : '&nbsp;'}</td>
                          </tr>
                        `).join('')}
                      </tbody>
                    </table>
                  </div>
                </div>
              </div>
            `;
      }).join('')}
        </div>
      `;
    }

        chunks.push(roomList.slice(i, i + 4));

      if (chunks.length === 0) chunks.push([]);

      // TTD Ketua Panitia dihapus dari Kartu Peserta sesuai permintaan user

      return `

            <span class="px-2.5 py-1 rounded-full text-[11px] font-bold bg-emerald-50 text-emerald-800 border border-emerald-200">4 Kartu Portrait (7×11 cm) / Lembar F4</span>

                <span>KARTU PESERTA UJIAN PORTRAIT (7 CM × 11 CM) — ${state.selectedRoom.toUpperCase()}</span>

              ${cards.length === 0 ? `
                <div style="padding: 40px; text-align: center; border: 1px dashed #000;">

                </div>
              ` : `
                <div style="display: grid; grid-template-columns: repeat(2, 70mm); justify-content: center; gap: 10mm 12mm; padding-top: 4mm;">
                  ${cards.map(p => `
                    <!-- KARTU PESERTA PORTRAIT: LEBAR 7 CM (70mm) x TINGGI/PANJANG 11 CM (110mm) AKSEN HIJAU TANPA PAS FOTO & TANPA TTD -->
                    <div style="width: 70mm; height: 110mm; border: 1.5px solid #065F46; border-radius: 8px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; background: #FFFFFF; page-break-inside: avoid; position: relative; box-shadow: 0 1px 4px rgba(6,95,70,0.10); -webkit-print-color-adjust: exact; print-color-adjust: exact; font-family: Arial, Helvetica, sans-serif;">
                      ${state.settings.cardBgImage ? `<div style="position: absolute; inset: 0; background-image: url('${state.settings.cardBgImage}'); background-size: cover; background-position: center; opacity: 0.12; pointer-events: none; z-index: 0;"></div>` : ''}

                      <!-- Header Kartu Hijau Emerald Tegas & Proporsional -->
                      <div style="background: linear-gradient(145deg, #064E3B 0%, #059669 65%, #10B981 100%); color: #FFFFFF; padding: 3mm 2.5mm; text-align: center; border-bottom: 2.5px solid #A7F3D0; position: relative; z-index: 1;">
                        <div style="font-size: 7.5pt; font-weight: 800; color: #ECFDF5; text-transform: uppercase; line-height: 1.15; margin: 0; letter-spacing: 0.3px;">${state.settings.yayasan}</div>
                        <div style="font-size: 11pt; font-weight: 900; text-transform: uppercase; margin: 1.2mm 0 0.8mm 0; color: #FFFFFF; line-height: 1.15; letter-spacing: 0.5px;">KARTU PESERTA UJIAN</div>
                        <div style="font-size: 8.5pt; font-weight: 800; color: #FEF08A; text-transform: uppercase; line-height: 1.15; margin: 0; letter-spacing: 0.3px;">${state.settings.instansi}</div>

                    </div>
                  `).join('')}
                </div>
              `}
            </div>
          `).join('')}
        </div>
    `;
    }

    // MODUL 4: JADWAL PIKET RUANGAN BERDASARKAN NAMA PADA RUANGAN
    function renderModuleJadwalPiket() {
      const roomList = getRoomParticipants(state.selectedRoom);
      const piketByDay = {};
      DAY_LIST.forEach(d => piketByDay[d] = []);

      roomList.forEach((p, idx) => {
        const day = DAY_LIST.includes(p.hari_piket) ? p.hari_piket : DAY_LIST[idx % DAY_LIST.length];
        piketByDay[day].push(p);
      });

      return `
        ${renderRoomSelectorBar()}

        const tanggal = sched.tanggal || '';
        return {
          dayKey,
          no: idx + 1,
          label: tanggal ? `${dayLabel}, ${tanggal}` : dayLabel,
          tanggal: tanggal,
          slots: sched.slots || []
        };
      });

      const sessionTimes = [
        { sesi: 1, jamKe: 'I' },
        { sesi: 2, jamKe: 'II' },
        { sesi: 3, jamKe: 'III' },
        { sesi: 4, jamKe: 'IV' }
      ];

      const getProctorSlotWaktu = (dayKey, sesiNum) => {
        const sched = (state.schedules && state.schedules[dayKey]) || (typeof DEFAULT_SCHEDULES !== 'undefined' && DEFAULT_SCHEDULES[dayKey]);
        if (sched && sched.slots) {
          const slot = sched.slots.find(s => Number(s.sesi) === Number(sesiNum));

      const dayKeys = ['Senin', 'Selasa', 'Rabu', 'Kamis', 'Jumat', 'Sabtu'];

        const sched = (state.schedules && state.schedules[dayKey]) || (typeof DEFAULT_SCHEDULES !== 'undefined' && DEFAULT_SCHEDULES[dayKey]) || {};
        const dayLabel = dayKey === 'Jumat' ? "Jum'at" : dayKey;
        const tanggal = sched.tanggal || '';
        return {
          dayKey,
          no: idx + 1,
          label: tanggal ? `${dayLabel}, ${tanggal}` : dayLabel,
          tanggal: tanggal
        };
      });

      const getProctorSlotWaktu = (dayKey, sesiNum) => {
        const sched = (state.schedules && state.schedules[dayKey]) || (typeof DEFAULT_SCHEDULES !== 'undefined' && DEFAULT_SCHEDULES[dayKey]);

        if (sesiNum === 3) return dayKey === 'Jumat' ? '10:15 - 11:30' : '10:30 - 11:45';

    function formatDisplayClass(cls, isDiniyyah) {
      let s = String(cls || '').trim();
      if (isDiniyyah) {
        s = s.replace(/ulya/gi, 'Wustho');
        if (/ULA/i.test(s)) {
          const sub = s.replace(/ULA/gi, '').trim();
          return 'Ula ' + (sub || '1');
        }
        if (/WUSTHO|WUSTHA/i.test(s)) {
          const sub = s.replace(/WUSTHO|WUSTHA/gi, '').trim();
          return 'Wustho ' + (sub || '1');
        }
        return s;
      } else {
        const m = s.match(/^(\d+[A-Z]?)/i);
        if (m) {
          return m[1].toUpperCase();
        }
        return s.replace(/MTS|MA/gi, '').trim();
      }
    }

    function getScheduleClassKey(kelasStr) {
      const s = String(kelasStr || '').toUpperCase().trim();

      // Diniyyah: Wustho / Ulya (Tingkat MA: 10, 11, 12)
      if (s.includes('WUSTHO') || s.includes('WUSTHA') || s.includes('ULYA') || /\b[1-3][A-Z]?\s*W\b/i.test(s) || /\bW\b/i.test(s) || /W\d+/i.test(s)) {
        if (/(?:WUSTHO|WUSTHA|ULYA)\s*3/i.test(s) || /\b3[A-Z]?\s*W\b/i.test(s) || /\b3[A-Z]?\b/i.test(s) || /III/i.test(s)) return 'MA_12';
        if (/(?:WUSTHO|WUSTHA|ULYA)\s*2/i.test(s) || /\b2[A-Z]?\s*W\b/i.test(s) || /\b2[A-Z]?\b/i.test(s) || /II/i.test(s)) return 'MA_11';
        if (/(?:WUSTHO|WUSTHA|ULYA)\s*1/i.test(s) || /\b1[A-Z]?\s*W\b/i.test(s) || /\b1[A-Z]?\b/i.test(s) || /\bI\b/i.test(s)) return 'MA_10';
        return 'MA_10';
      }

      // Diniyyah: Ula (Tingkat MTs: 7, 8, 9)
      if (s.includes('ULA') || /\b[1-3][A-Z]?\s*U\b/i.test(s) || /\bU\b/i.test(s) || /U\d+/i.test(s)) {
        if (/ULA\s*3/i.test(s) || /\b3[A-Z]?\s*U\b/i.test(s) || /\b3[A-Z]?\b/i.test(s) || /III/i.test(s)) return 'MTS_9';
        if (/ULA\s*2/i.test(s) || /\b2[A-Z]?\s*U\b/i.test(s) || /\b2[A-Z]?\b/i.test(s) || /II/i.test(s)) return 'MTS_8';
        if (/ULA\s*1/i.test(s) || /\b1[A-Z]?\s*U\b/i.test(s) || /\b1[A-Z]?\b/i.test(s) || /\bI\b/i.test(s)) return 'MTS_7';
        return 'MTS_7';
      }

      // Sekolah MA: 12, 11, 10
      if (/\b12[A-Z]?\b|XII/i.test(s)) return 'MA_12';
      if (/\b11[A-Z]?\b|XI/i.test(s)) return 'MA_11';
      if (/\b10[A-Z]?\b|\bX\b/i.test(s)) return 'MA_10';

      // Sekolah MTs: 9, 8, 7
      if (/\b9[A-Z]?\b|IX/i.test(s)) return 'MTS_9';
      if (/\b8[A-Z]?\b|VIII/i.test(s)) return 'MTS_8';
      if (/\b7[A-Z]?\b|VII/i.test(s)) return 'MTS_7';

      return 'MTS_7';
    }

    function renderModuleLabelMeja() {
      let participants = [];
      if (state.selectedRoom === 'ALL') {
        participants = state.participants.slice().sort((a, b) => {
          const rA = parseInt(String(a.ruangan).replace(/\D+/g, ''), 10) || 0;
          const rB = parseInt(String(b.ruangan).replace(/\D+/g, ''), 10) || 0;
          if (rA !== rB) return rA - rB;
          return (Number(a.no_kursi) || 0) - (Number(b.no_kursi) || 0);
        });
      } else {
        participants = getRoomParticipants(state.selectedRoom);
      }

      if (state.searchQuery && state.searchQuery.trim()) {
        const q = state.searchQuery.toLowerCase().trim();
        participants = participants.filter(p =>
          (p.nama && p.nama.toLowerCase().includes(q)) ||
          (p.no_peserta && p.no_peserta.toLowerCase().includes(q)) ||
          (p.kelas_sekolah && p.kelas_sekolah.toLowerCase().includes(q)) ||
          (p.kelas_diniyyah && p.kelas_diniyyah.toLowerCase().includes(q))
        );
      }

      const LABELS_PER_PAGE = 18; // 3 kolom x 6 baris (ukuran pas 64.5mm x 47mm pada kertas A4)
      const chunks = [];
      for (let i = 0; i < participants.length; i += LABELS_PER_PAGE) {
        chunks.push(participants.slice(i, i + LABELS_PER_PAGE));
      }
      if (chunks.length === 0) chunks.push([]);

      const activeRoomLabel = state.selectedRoom === 'ALL' ? 'Semua Ruangan' : state.selectedRoom;

      return `
        ${renderRoomSelectorBar()}

        <div class="no-print bg-white rounded-2xl p-4 border border-slate-200/80 shadow-sm mb-5 flex flex-wrap items-center justify-between gap-4">
          <div class="flex items-center gap-3">
            <div class="w-10 h-10 rounded-xl bg-gradient-to-br from-teal-500 to-emerald-600 text-white flex items-center justify-center shadow-md shadow-teal-500/20 font-bold">
              <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 7h10M7 11h10M7 15h6M4 5a2 2 0 012-2h12a2 2 0 012 2v14a2 2 0 01-2 2H6a2 2 0 01-2-2V5z" /></svg>
            </div>
            <div>
              <div class="flex items-center gap-2">
                <h3 class="text-base font-extrabold text-slate-800 uppercase tracking-wide">13. Label Meja Peserta Ujian</h3>
                <span class="text-[10px] font-bold px-2 py-0.5 rounded-full bg-teal-50 text-teal-700 border border-teal-200 uppercase">Kertas A4</span>
              </div>
              <p class="text-xs text-slate-500 mt-0.5">
                Stiker label meja ukuran <strong>64.5 × 47 mm</strong> disusun proporsional dalam format <strong>3 Kolom × 6 Baris (18 Label per Lembar A4)</strong>.
              </p>
            </div>
          </div>

          <div class="flex items-center gap-2.5">
            <div class="bg-slate-50 border border-slate-200 px-3.5 py-1.5 rounded-xl text-center">
              <span class="text-[10px] text-slate-500 uppercase font-bold block">Target</span>
              <span class="text-xs font-extrabold text-slate-800">${activeRoomLabel}</span>
            </div>
            <div class="bg-teal-50 border border-teal-200 px-3.5 py-1.5 rounded-xl text-center">
              <span class="text-[10px] text-teal-600 uppercase font-bold block">Total Label</span>
              <span class="text-xs font-extrabold text-teal-800">${participants.length} Siswa</span>
            </div>
            <div class="bg-indigo-50 border border-indigo-200 px-3.5 py-1.5 rounded-xl text-center">
              <span class="text-[10px] text-indigo-600 uppercase font-bold block">Lembar A4</span>
              <span class="text-xs font-extrabold text-indigo-800">${chunks.length} Halaman</span>
            </div>
          </div>
        </div>

        <div id="print-mount">
          ${chunks.map((sheetItems) => {
        const rows = [];
        for (let r = 0; r < sheetItems.length; r += 3) {
          rows.push(sheetItems.slice(r, r + 3));
        }
        return `
              <div class="a4-sheet" data-paper="A4" style="width: 210mm; min-height: 297mm; max-height: 297mm; padding: 3.5mm 5.75mm; margin: 0 auto 24px auto; background: #ffffff; box-sizing: border-box; page-break-after: always; break-after: page; position: relative;">
                <table style="width: 100%; border-collapse: separate; border-spacing: 2.5mm 1.5mm; border: none; margin: 0 auto;">
                  <tbody>
                    ${rows.map(row => `
                      <tr>
                        ${row.map(p => `
                          <td style="width: 64.5mm; height: 47mm; padding: 0; border: none; vertical-align: top;">
                            ${renderDeskLabel(p)}
                          </td>
                        `).join('')}
                        ${row.length < 3 ? Array(3 - row.length).fill(0).map(() => `
                          <td style="width: 64.5mm; height: 47mm; padding: 0; border: none; vertical-align: top;">
                            <div style="width: 64.5mm; height: 47mm; border: 1px dashed #cbd5e1; border-radius: 6px; display: flex; align-items: center; justify-content: center; color: #94a3b8; font-size: 7pt; font-style: italic;">
                              (Label Kosong)
                            </div>
                          </td>
                        `).join('') : ''}
                      </tr>
                    `).join('')}
                  </tbody>
                </table>
              </div>
            `;
      }).join('')}
        </div>
      `;
    }

    // ==========================================
    // CETAK HASIL PREVIEW & SIMPAN PDF
    // ==========================================
    function hasPreview() {
      return document.querySelectorAll('#print-mount .f4-sheet, #print-mount .a4-sheet').length > 0;
    }

    function updateDynamicPrintStyle() {
      const isA4 = document.querySelectorAll('#print-mount .a4-sheet').length > 0;
      const isLandscape = document.querySelectorAll('#print-mount .landscape-sheet, #print-mount [data-orientation="landscape"]').length > 0;
      let dynStyle = document.getElementById('dynamic-print-page-style');
      if (!dynStyle) {
        dynStyle = document.createElement('style');
        dynStyle.id = 'dynamic-print-page-style';
        document.head.appendChild(dynStyle);
      }
      if (isLandscape) {
        dynStyle.innerHTML = '@page { size: 330mm 215mm; margin: 5mm; } @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
      } else if (isA4) {
        dynStyle.innerHTML = '@page { size: A4 portrait; margin: 0; } @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
      } else {
        dynStyle.innerHTML = '@page { size: 215mm 330mm; margin: 8mm; } @media print { body { -webkit-print-color-adjust: exact; print-color-adjust: exact; } }';
      }
    }

    let isBulkPrinting = false;

    function fillPrintRoot() {
      if (isBulkPrinting) return;
      const root = document.getElementById('print-root');
      const mount = document.getElementById('print-mount');
      if (!root) return;
      root.innerHTML = mount ? mount.innerHTML : '';
      updateDynamicPrintStyle();
    }

    window.addEventListener('beforeprint', fillPrintRoot);
    window.addEventListener('afterprint', () => {
      isBulkPrinting = false;
      const root = document.getElementById('print-root');
      if (root) root.innerHTML = '';
    });

    function printPreview() {
      if (!hasPreview()) {
        notify("Halaman ini tidak memiliki pratinjau dokumen untuk dicetak.", "error");
        return;
      }
      isBulkPrinting = false;
      fillPrintRoot();
      window.print();
    }

    function bulkPrint() {
      let sheets = [];
      const mount = document.getElementById('print-mount');
      const currentSheets = mount ? mount.querySelectorAll('.f4-sheet, .a4-sheet') : [];
      if (currentSheets.length > 1) {
        sheets = Array.from(currentSheets);
      } else {
        sheets = collectBulkSheets();
      }

      if (!sheets || sheets.length === 0) {
        notify("Tidak ada lembar dokumen untuk dicetak.", "error");
        return;
      }

      notify(`Menyiapkan cetak seluruh lembar (${sheets.length} halaman)... Mohon tunggu dialog cetak printer muncul.`);
      const root = document.getElementById('print-root');
      if (!root) return;
      isBulkPrinting = true;
      root.innerHTML = '';
      sheets.forEach(sh => {
        const clone = sh.cloneNode(true);
        root.appendChild(clone);
      });
      updateDynamicPrintStyle();
      setTimeout(() => {
        window.print();
        setTimeout(() => { isBulkPrinting = false; }, 1500);
      }, 100);
    }

    async function savePdfFromSheets(sheets, fileName) {
      if (!sheets || sheets.length === 0) {
        notify("Tidak ada lembar dokumen untuk disimpan.", "error");
        return;
      }
      if (typeof html2canvas === 'undefined' || !window.jspdf) {
        notify("Pustaka PDF belum siap, periksa koneksi internet lalu coba lagi.", "error");
        return;
      }
      notify(`Membuat file PDF (${sheets.length} halaman), mohon tunggu...`);
      const hasLandscape = sheets.some(sh => sh.classList && (sh.classList.contains('landscape-sheet') || sh.dataset.orientation === 'landscape'));
      const isAllA4 = sheets.every(sh => sh.classList && (sh.classList.contains('a4-sheet') || sh.dataset.paper === 'A4'));
      const stageW = hasLandscape ? '330mm' : (isAllA4 ? '210mm' : '215mm');

      const stage = document.createElement('div');
      stage.style.cssText = `position: fixed; left: -10000px; top: 0; width: ${stageW}; background: #FFFFFF; z-index: -1;`;
      try {
        if (document.fonts && document.fonts.ready) await document.fonts.ready;
        sheets.forEach(sh => {
          const clone = sh.cloneNode(true);
          clone.style.margin = '0';
          clone.style.border = 'none';
          clone.style.boxShadow = 'none';
          const isL = clone.classList && (clone.classList.contains('landscape-sheet') || clone.dataset.orientation === 'landscape');
          const isA = clone.classList && (clone.classList.contains('a4-sheet') || clone.dataset.paper === 'A4');
          if (isL) {
            clone.style.width = '330mm';
            clone.style.minHeight = '215mm';
          } else if (isA) {
            clone.style.width = '210mm';
            clone.style.minHeight = '297mm';
          } else {
            clone.style.width = '215mm';
            clone.style.minHeight = '330mm';
          }
          stage.appendChild(clone);
        });
        document.body.appendChild(stage);

        const imgs = Array.from(stage.querySelectorAll('img'));
        await Promise.all(imgs.map(img => {
          if (img.complete) return Promise.resolve();
          return new Promise(res => { img.onload = img.onerror = res; });
        }));

        stage.querySelectorAll('.f4-sheet:not(.landscape-sheet):not([data-orientation="landscape"])').forEach(sh => fitSheetTables(sh));

        const { jsPDF } = window.jspdf;
        let pdf = null;
        let firstPage = true;

        const renderedSheets = stage.querySelectorAll('.f4-sheet, .a4-sheet');
        for (const sheet of renderedSheets) {
          const isL = sheet.classList.contains('landscape-sheet') || sheet.dataset.orientation === 'landscape';
          const isA = sheet.classList.contains('a4-sheet') || sheet.dataset.paper === 'A4';
          const PAGE_W = isL ? (isA ? 297 : 330) : (isA ? 210 : 215);
          const PAGE_H = isL ? (isA ? 210 : 215) : (isA ? 297 : 330);
          const orientation = isL ? 'landscape' : 'portrait';

          if (!pdf) {
            pdf = new jsPDF({ orientation, unit: 'mm', format: [PAGE_W, PAGE_H] });
          }

          const canvas = await html2canvas(sheet, { scale: 2, backgroundColor: '#FFFFFF', useCORS: true });
          const ratio = canvas.height / sheet.offsetHeight;
          const mm = sheet.offsetWidth / PAGE_W;
          const sr = sheet.getBoundingClientRect();

          const unbreakable = [];
          sheet.querySelectorAll('[style*="page-break-inside"]').forEach(el => {
            const r = el.getBoundingClientRect();
            unbreakable.push([r.top - sr.top, r.bottom - sr.top]);
          });
          let cand = [];
          const addCand = el => cand.push(el.getBoundingClientRect().bottom - sr.top);
          Array.from(sheet.children).forEach(addCand);
          sheet.querySelectorAll('tr, li').forEach(addCand);
          sheet.querySelectorAll('[style*="grid"]').forEach(g => Array.from(g.children).forEach(addCand));
          const contentEnd = Math.max(...cand, 1);
          cand = cand.filter(c => !unbreakable.some(([t, bt]) => c > t + 1 && c < bt - 1));

          const pages = [];
          let pos = 0;
          const maxHPerPg = isL ? (PAGE_H - 10) : (isA ? (297 - 10) : 310);
          const firstMaxH = isL ? PAGE_H : (isA ? 297 : 320);
          while (pos < contentEnd - 1) {
            const limit = pos + (pages.length === 0 ? firstMaxH : maxHPerPg) * mm;
            let end;
            if (contentEnd <= limit + 1) {
              end = contentEnd;
            } else {
              const fit = cand.filter(c => c > pos + 5 * mm && c <= limit + 0.5);
              end = fit.length ? Math.max(...fit) : limit;
            }
            pages.push([pos, end]);
            pos = end;
          }
          if (pages.length === 0) pages.push([0, contentEnd]);

          pages.forEach(([y0, y1], idx) => {
            const srcY = Math.round(y0 * ratio);
            const srcH = Math.max(1, Math.round((y1 - y0) * ratio));
            const part = document.createElement('canvas');
            part.width = canvas.width;
            part.height = srcH;
            const ctx = part.getContext('2d');
            ctx.fillStyle = '#FFFFFF';
            ctx.fillRect(0, 0, part.width, part.height);
            ctx.drawImage(canvas, 0, srcY, canvas.width, srcH, 0, 0, canvas.width, srcH);
            if (!firstPage) {
              pdf.addPage([PAGE_W, PAGE_H], orientation);
            }
            firstPage = false;
            const destH = (y1 - y0) / mm;
            const destY = (idx === 0 || isA || isL) ? 0 : 10;
            pdf.addImage(part.toDataURL('image/jpeg', 0.95), 'JPEG', 0, destY, PAGE_W, destH);
          });
        }

        if (!fileName) fileName = exportFileBase('.pdf');
        if (!fileName.toLowerCase().endsWith('.pdf')) fileName += '.pdf';
        pdf.save(fileName);
        notify("PDF berhasil dibuat: " + fileName);
      } catch (err) {
        notify("Gagal membuat PDF: " + err.message, "error");
      } finally {
        if (stage.parentNode) stage.parentNode.removeChild(stage);
      }
    }

    async function savePreviewAsPdf() {
      if (!hasPreview()) {
        notify("Halaman ini tidak memiliki pratinjau dokumen untuk disimpan.", "error");
        return;
      }
      const sheets = Array.from(document.querySelectorAll('#print-mount .f4-sheet, #print-mount .a4-sheet'));
      await savePdfFromSheets(sheets, exportFileBase('.pdf'));
    }

    function fitSheetTables(sheet, limitMM = 320, minTrh = 14) {
      const tables = Array.from(sheet.querySelectorAll('table.f4-table, table.f4-plain'));
      if (!tables.length || !sheet.offsetWidth) return;
      const mm = sheet.offsetWidth / 215;
      const limit = sheet.getBoundingClientRect().top + limitMM * mm; // 320 mm = sisakan margin bawah 10 mm
      const bottomOf = () => {
        let b = 0;
        Array.from(sheet.children).forEach(c => { b = Math.max(b, c.getBoundingClientRect().bottom); });
        return b;
      };
      // Ukuran huruf proporsional: semua ukuran di dalam tabel diubah ke satuan em
      // sehingga ketika tabel diperkecil, seluruh teks (isi, kepala, keterangan) ikut mengecil sebanding.
      tables.forEach(t => {
        if (t.dataset.em) return;
        t.dataset.em = '1';
        const todo = [];
        t.querySelectorAll('[style*="font-size"]').forEach(el => {
          const par = el.parentElement;
          const ratio = parseFloat(getComputedStyle(el).fontSize) / parseFloat(getComputedStyle(par).fontSize);
          if (isFinite(ratio) && ratio > 0) todo.push([el, ratio]);
        });
        todo.forEach(([el, r]) => { el.style.fontSize = (Math.round(r * 1000) / 1000) + 'em'; });
      });
      tables.forEach(t => {
        if (!t.dataset.fs) {
          t.dataset.fs = parseFloat(t.style.fontSize) || 10;
          t.dataset.pad = parseFloat(t.style.getPropertyValue('--tpy')) || (t.classList.contains('f4-plain') ? 3 : 4);
        }
      });
      for (let step = 0; step <= 16; step++) {
        tables.forEach(t => {
          const pad = Math.max(1, Number(t.dataset.pad) - step * 0.5);
          const fs = Math.max(7, Number(t.dataset.fs) - Math.max(0, step - 6) * 0.4);
          const trh = Math.max(minTrh, 22 - step);
          t.style.setProperty('--tpy', pad + 'px');
          t.style.setProperty('--trh', trh + 'px');
          t.style.fontSize = fs + 'pt';
        });
        if (bottomOf() <= limit) break;
      }
      // Tabel di dalam kartu (Jadwal Piket): semua kartu memakai ukuran huruf yang sama,
      // diturunkan bersama sampai isi terpanjang muat satu baris di kotaknya.
      const plain = tables.filter(t => t.classList.contains('f4-plain'));
      if (plain.length) {
        let fs = Math.max(...plain.map(t => parseFloat(t.style.fontSize) || 9));
        const over = () => plain.some(t => t.parentElement && t.scrollWidth > t.parentElement.clientWidth - 4);
        plain.forEach(t => { t.style.fontSize = fs + 'pt'; });
        while (over() && fs > 6) {
          fs -= 0.25;
          plain.forEach(t => { t.style.fontSize = fs + 'pt'; });
        }
      }
    }

    function fitAllSheets() {
      document.querySelectorAll('#print-mount .f4-sheet').forEach(sh => fitSheetTables(sh));
    }

    if (document.fonts && document.fonts.ready) {
      document.fonts.ready.then(() => fitAllSheets());
    }
